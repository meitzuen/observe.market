<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>持股計算機 | Market Observer</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <style>
@media (max-width: 480px) {

        h1 span.title-text {
          display: none;
        }
}

      main {
        max-width: 1300px;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .page-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
        color: var(--hud-text-1);
      }

      .eval-date-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--hud-card-bg);
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        padding: 0.45rem 0.75rem;
      }

      .eval-date-box label {
        font-size: 0.85rem;
        color: var(--hud-text-3);
        font-weight: 600;
        white-space: nowrap;
      }

      .eval-date-box input[type="date"] {
        border: none;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--hud-text-1);
        background: transparent;
        outline: none;
      }

      .btn-primary {
        background: transparent; border: 1px solid var(--hud-border-1);
        color: var(--hud-text-1);
      }

      .btn-primary:hover {
        background: var(--hud-hover-bg);
      }

      .btn-secondary:hover {
        background: var(--hud-bg);
        color: var(--hud-text-1);
      }

      .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.2rem 0.35rem;
        font-size: 0.9rem;
        line-height: 1;
        border-radius: 2px;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      .btn-icon:hover {
        background: var(--hud-bg);
      }

      /* Summary cards */
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }

      .summary-card {
        background: var(--hud-card-bg);
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        padding: 0.9rem 1.1rem;
        
      }

      .summary-card .label {
        font-size: 0.78rem;
        color: var(--hud-text-3);
        margin-bottom: 0.3rem;
      }

      .summary-card .value {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--hud-text-1);
      }

      /* Form panel */
      .form-panel {
        display: none;
        background: var(--hud-card-bg);
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.25rem;
        
      }

      .form-panel h2 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 1rem;
        color: var(--hud-text-1);
      }

      .form-row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .form-row .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .form-row label {
        font-size: 0.8rem;
        color: var(--hud-text-3);
        font-weight: 500;
      }

      .form-row input,
      .form-row select {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--hud-text-1);
        background: var(--hud-bg);
        transition: border-color 0.15s;
        outline: none;
      }

      .form-row input:focus,
      .form-row select:focus {
        border-color: var(--hud-text-1);
      }

      .form-row input#h-stock-id {
        width: 110px;
      }

      .form-row input#h-buy-date,
      .form-row input#h-qty,
      .form-row input#h-cost {
        width: 130px;
      }

      .form-row select#h-unit {
        width: 70px;
      }

      .stock-name-hint {
        font-size: 0.82rem;
        color: var(--hud-text-3);
        min-width: 90px;
      }

      .form-actions {
        display: flex;
        gap: 0.5rem;
      }

      .error-msg {
        color: var(--hud-up);
        font-size: 0.85rem;
        margin-top: 0.6rem;
      }

      /* Table */
      .table-wrap {
        background: var(--hud-card-bg);
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        overflow-x: auto;
        
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr:hover {
        background: color-mix(in srgb, var(--hud-text-1) 4%, transparent);
      }

      .stock-cell .code {
        font-weight: 700;
        color: var(--hud-text-1);
      }

      .stock-cell .name {
        color: var(--hud-text-3);
        font-size: 0.8rem;
        margin-left: 0.35rem;
      }

      .price-neutral {
        color: var(--hud-text-3);
      }

      .no-data-tag {
        color: var(--hud-text-3);
        font-size: 0.78rem;
        font-style: italic;
      }

      .row-actions {
        display: flex;
        gap: 0.25rem;
        justify-content: flex-end;
      }

      tfoot td {
        font-weight: 700;
        border-top: 2px solid var(--hud-border-2);
        border-bottom: none;
        background: var(--hud-bg);
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--hud-text-3);
      }

      .empty-state .icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      .hint-text {
        font-size: 0.8rem;
        color: var(--hud-text-3);
        margin-top: 0.4rem;
      }
    </style>
  </head>

    <main>
      <div class="page-header">
        <p class="page-title">🧮 持股計算機</p>

          <div class="label">總成本</div>
          <div class="value" id="sum-cost">—</div>

        <div class="summary-card">

    <script src="assets/nerd-grid.js"></script>
    <script>
          NerdGrid.initThemeToggle();
          NerdGrid.initNavDropdowns();

      // ── Storage keys ────────────────────────────────────────────────────────
      const STORAGE_KEY = "portfolio_holdings";
      const EVAL_DATE_KEY = "portfolio_eval_date";

      // ── State ───────────────────────────────────────────────────────────────
      let holdings = [];
      let stockInfo = {};
      const historyCache = {}; // stockId -> [{date, close}, ...] sorted ascending
      let editingId = null;

      function todayStr() {
        return new Date().toISOString().slice(0, 10);
      }

      function loadHoldings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          holdings = raw ? JSON.parse(raw) : [];
        } catch {
          holdings = [];
        }
      }

      function saveHoldings() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(holdings));
      }

      function uid() {
        return `h_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      }

      // ── Data loading ────────────────────────────────────────────────────────
      async function loadStockInfo() {
        try {
          const res = await fetch("data/stock_info.json");
          stockInfo = await res.json();
        } catch (e) {
          console.error("無法載入 stock_info.json：", e);
          stockInfo = {};
        }
        const datalist = document.getElementById("stock-datalist");
        datalist.innerHTML = Object.entries(stockInfo)
          .map(
            ([id, info]) =>
              `<option value="${id}">${escHtml(info.name || "")}</option>`,
          )
          .join("");
      }

      async function getHistory(stockId) {
        if (historyCache[stockId] !== undefined) return historyCache[stockId];
        const info = stockInfo[stockId];
        const market = info?.type === "tpex" ? "tpex" : "twse";
        try {
          const res = await fetch(
            `data/${market}/stock_history/${stockId}.json`,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          historyCache[stockId] = data;
          return data;
        } catch (e) {
          historyCache[stockId] = null;
          return null;
        }
      }

      // Find close price on or before targetDate (yyyy-mm-dd). Returns {date, close} or null.
      function findPriceOnOrBefore(history, targetDate) {
        if (!history || history.length === 0) return null;
        let best = null;
        for (const row of history) {
          if (row.date <= targetDate) {
            if (!best || row.date > best.date) best = row;
          }
        }
        return best ? { date: best.date, close: best.close } : null;
      }

      // ── Formatting ──────────────────────────────────────────────────────────
      function fmtMoney(v) {
        if (v == null || Number.isNaN(v)) return "—";
        return v.toLocaleString("zh-TW", { maximumFractionDigits: 0 });
      }

      function fmtPrice(v) {
        if (v == null || Number.isNaN(v)) return "—";
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function fmtPct(v) {
        if (v == null || Number.isNaN(v)) return "—";
        const sign = v > 0 ? "+" : "";
        return `${sign}${v.toFixed(2)}%`;
      }

      function plClass(v) {
        if (v == null || Number.isNaN(v) || v === 0) return "price-neutral";
        return v > 0 ? "price-up" : "price-down";
      }

      function fmtQty(shares, unit) {
        if (unit === "lot") {
          const lots = shares / 1000;
          return `${lots.toLocaleString("zh-TW", { maximumFractionDigits: 3 })} 張`;
        }
        return `${shares.toLocaleString("zh-TW")} 股`;
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // ── Form panel ──────────────────────────────────────────────────────────
      let formPanelOpen = false;

      function toggleFormPanel() {
        formPanelOpen ? closeFormPanel() : openFormPanel();
      }

      function openFormPanel(h) {
        formPanelOpen = true;
        editingId = h ? h.id : null;
        document.getElementById("form-panel").style.display = "block";
        document.getElementById("form-panel-title").textContent = h
          ? "編輯持股"
          : "新增持股";
        document.getElementById("form-submit-btn").textContent = h
          ? "儲存"
          : "新增";
        document.getElementById("h-stock-id").value = h ? h.stockId : "";
        document.getElementById("h-buy-date").value = h
          ? h.buyDate
          : todayStr();
        document.getElementById("h-unit").value = h ? h.unit : "lot";
        document.getElementById("h-qty").value = h
          ? h.unit === "lot"
            ? h.shares / 1000
            : h.shares
          : "";
        document.getElementById("h-cost").value = h ? h.costPrice : "";
        document.getElementById("form-error").style.display = "none";
        updateStockNameHint();
        document.getElementById("h-stock-id").focus();
        document
          .getElementById("form-panel")
          .scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function closeFormPanel() {
        formPanelOpen = false;
        editingId = null;
        document.getElementById("form-panel").style.display = "none";
        document.getElementById("h-stock-id").value = "";
        document.getElementById("h-buy-date").value = "";
        document.getElementById("h-qty").value = "";
        document.getElementById("h-cost").value = "";
        document.getElementById("h-stock-name").textContent = " ";
        document.getElementById("form-error").style.display = "none";
      }

      function updateStockNameHint() {
        const id = document.getElementById("h-stock-id").value.trim();
        const info = stockInfo[id];
        const hint = document.getElementById("h-stock-name");
        hint.textContent = info
          ? `${info.name}（${info.type === "tpex" ? "上櫃" : "上市"}）`
          : " ";
      }

      async function autofillCostPrice() {
        const id = document.getElementById("h-stock-id").value.trim();
        const buyDate = document.getElementById("h-buy-date").value;
        const errDiv = document.getElementById("form-error");
        errDiv.style.display = "none";
        if (!id || !stockInfo[id]) {
          errDiv.textContent = "請先輸入有效的股票代號";
          errDiv.style.display = "block";
          return;
        }
        if (!buyDate) {
          errDiv.textContent = "請先選擇買入日期";
          errDiv.style.display = "block";
          return;
        }
        const history = await getHistory(id);
        const found = findPriceOnOrBefore(history, buyDate);
        if (!found) {
          errDiv.textContent = "查無該股票在買入日之前的收盤價資料，請手動輸入";
          errDiv.style.display = "block";
          return;
        }
        document.getElementById("h-cost").value = found.close;
      }

      function showFormError(msg) {
        const errDiv = document.getElementById("form-error");
        errDiv.textContent = msg;
        errDiv.style.display = "block";
      }

      function submitForm() {
        const id = document.getElementById("h-stock-id").value.trim();
        const buyDate = document.getElementById("h-buy-date").value;
        const unit = document.getElementById("h-unit").value;
        const qtyRaw = parseFloat(document.getElementById("h-qty").value);
        const costPrice = parseFloat(document.getElementById("h-cost").value);

        if (!id) return showFormError("請輸入股票代號");
        if (!stockInfo[id])
          return showFormError("查無此股票代號，請確認輸入是否正確");
        if (!buyDate) return showFormError("請選擇買入日期");
        if (!qtyRaw || qtyRaw <= 0)
          return showFormError("請輸入有效的持有數量");
        if (!costPrice || costPrice <= 0)
          return showFormError("請輸入有效的買入均價");

        const shares = unit === "lot" ? qtyRaw * 1000 : qtyRaw;

        if (editingId) {
          const h = holdings.find((x) => x.id === editingId);
          if (h) {
            h.stockId = id;
            h.buyDate = buyDate;
            h.unit = unit;
            h.shares = shares;
            h.costPrice = costPrice;
          }
        } else {
          holdings.push({
            id: uid(),
            stockId: id,
            buyDate,
            unit,
            shares,
            costPrice,
          });
        }

        saveHoldings();
        closeFormPanel();
        renderHoldings();
      }

      function deleteHolding(id) {
        const h = holdings.find((x) => x.id === id);
        if (!h) return;
        const name = stockInfo[h.stockId]?.name || h.stockId;
        if (
          !confirm(
            `確定要刪除「${h.stockId} ${name}」這筆持股紀錄？此操作無法復原。`,
          )
        )
          return;
        holdings = holdings.filter((x) => x.id !== id);
        saveHoldings();
        renderHoldings();
      }

      // ── Render ──────────────────────────────────────────────────────────────
      async function renderHoldings() {
        document.getElementById("loading-msg").style.display = "none";
        const tableWrap = document.getElementById("table-wrap");
        const emptyState = document.getElementById("empty-state");
        const summaryGrid = document.getElementById("summary-grid");

        if (holdings.length === 0) {
          tableWrap.style.display = "none";
          summaryGrid.style.display = "none";
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = "none";
        tableWrap.style.display = "block";
        summaryGrid.style.display = "grid";

        const evalDate =
          document.getElementById("eval-date").value || todayStr();
        document.getElementById("th-eval-price").textContent =
          `${evalDate} 市價`;

        const rows = await Promise.all(
          holdings.map(async (h) => {
            const info = stockInfo[h.stockId];
            const history = await getHistory(h.stockId);
            const found = findPriceOnOrBefore(history, evalDate);
            const cost = h.shares * h.costPrice;
            const marketValue = found ? h.shares * found.close : null;
            const pl = marketValue != null ? marketValue - cost : null;
            const plPct =
              marketValue != null && cost > 0 ? (pl / cost) * 100 : null;
            return { h, info, found, cost, marketValue, pl, plPct };
          }),
        );

        const tbody = document.getElementById("holdings-tbody");
        tbody.innerHTML = rows
          .map(({ h, info, found, cost, marketValue, pl, plPct }) => {
            const name = info ? info.name : "";
            const priceCell = found
              ? `${fmtPrice(found.close)}${found.date !== evalDate ? `<div class="no-data-tag">${found.date}</div>` : ""}`
              : `<span class="no-data-tag">無資料</span>`;
            return `<tr>
              <td class="stock-cell"><span class="code">${escHtml(h.stockId)}</span><span class="name">${escHtml(name)}</span></td>
              <td>${escHtml(h.buyDate)}</td>
              <td>${fmtQty(h.shares, h.unit)}</td>
              <td>${fmtPrice(h.costPrice)}</td>
              <td>${fmtMoney(cost)}</td>
              <td>${priceCell}</td>
              <td>${fmtMoney(marketValue)}</td>
              <td class="${plClass(pl)}">${pl == null ? "—" : (pl > 0 ? "+" : "") + fmtMoney(pl)}</td>
              <td class="${plClass(plPct)}">${fmtPct(plPct)}</td>
              <td>
                <div class="row-actions">
                  <button class="btn-icon" title="編輯" onclick='openHoldingEditor(${JSON.stringify(h.id)})'>✏️</button>
                  <button class="btn-icon" title="刪除" onclick='deleteHolding(${JSON.stringify(h.id)})'>🗑️</button>
                </div>
              </td>
            </tr>`;
          })
          .join("");

        const totalCost = rows.reduce((s, r) => s + r.cost, 0);
        const totalValue = rows.reduce((s, r) => s + (r.marketValue ?? 0), 0);
        const hasAllPrices = rows.every((r) => r.marketValue != null);
        const totalPl = hasAllPrices ? totalValue - totalCost : null;
        const totalPct =
          hasAllPrices && totalCost > 0 ? (totalPl / totalCost) * 100 : null;

        document.getElementById("sum-cost").textContent = fmtMoney(totalCost);
        document.getElementById("sum-value").textContent = hasAllPrices
          ? fmtMoney(totalValue)
          : `${fmtMoney(totalValue)}+`;
        const sumPlEl = document.getElementById("sum-pl");
        sumPlEl.textContent =
          totalPl == null
            ? "部分無資料"
            : (totalPl > 0 ? "+" : "") + fmtMoney(totalPl);
        sumPlEl.className = "value " + plClass(totalPl);
        const sumPctEl = document.getElementById("sum-pct");
        sumPctEl.textContent = fmtPct(totalPct);
        sumPctEl.className = "value " + plClass(totalPct);
      }

      function openHoldingEditor(id) {
        const h = holdings.find((x) => x.id === id);
        if (h) openFormPanel(h);
      }

      // ── Init ────────────────────────────────────────────────────────────────
      document
        .getElementById("toggle-form-btn")
        .addEventListener("click", toggleFormPanel);
      document
        .getElementById("form-cancel-btn")
        .addEventListener("click", closeFormPanel);
      document
        .getElementById("form-submit-btn")
        .addEventListener("click", submitForm);
      document
        .getElementById("h-autofill-btn")
        .addEventListener("click", autofillCostPrice);
      document
        .getElementById("h-stock-id")
        .addEventListener("input", updateStockNameHint);
      ["h-stock-id", "h-buy-date", "h-qty", "h-cost"].forEach((id) => {
        document.getElementById(id).addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitForm();
          if (e.key === "Escape") closeFormPanel();
        });
      });

      const evalDateInput = document.getElementById("eval-date");
      evalDateInput.value = localStorage.getItem(EVAL_DATE_KEY) || todayStr();
      evalDateInput.addEventListener("change", () => {
        localStorage.setItem(EVAL_DATE_KEY, evalDateInput.value);
        renderHoldings();
      });

      (async function init() {
        loadHoldings();
        await loadStockInfo();
        renderHoldings();
      })();
    </script>
    
  </body>
</html>
