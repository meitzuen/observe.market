<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warrant Observer | 權證觀測站</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <style>
      .toolbar .tabs {
        margin-bottom: 0;
      }

      .table-container th[onclick] {
        cursor: pointer;
      }

      .table-container th[onclick]:hover {
        background: var(--hover);
      }
    </style>
  </head>
  <body>
    <header id="site-header"></header>

    <div class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">精選權證</h1>
          <p class="page-subtitle">精選權證清單</p>
        </div>
        <div class="page-actions">
          <select id="date-picker" class="date-select" aria-label="選擇日期"></select>
          <span id="last-update" class="last-update"></span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">
          <span
            >權證行情
            <span id="warrant-count" class="badge badge-primary"></span
          ></span>
        </div>
        <div class="search-box">
          <input
            type="text"
            id="warrant-search"
            placeholder="搜尋代號、名稱或標的..."
            aria-label="搜尋代號、名稱或標的"
          />
        </div>
        <div class="toolbar">
          <div class="tabs">
            <button class="tab type-btn active" data-type="all">全部</button>
            <button class="tab type-btn" data-type="認購">認購</button>
            <button class="tab type-btn" data-type="認售">認售</button>
          </div>
        </div>
        <div class="table-container sticky">
          <table>
            <thead>
              <tr id="table-header">
                <th onclick="setSort('權證代碼')">
                  權證代碼 <span id="sort-權證代碼"></span>
                </th>
                <th onclick="setSort('權證名稱')">
                  權證名稱 <span id="sort-權證名稱"></span>
                </th>
                <th onclick="setSort('標的名稱')">
                  標的 <span id="sort-標的名稱"></span>
                </th>
                <th onclick="setSort('認購/認售')">
                  認購/認售 <span id="sort-認購/認售"></span>
                </th>
                <th onclick="setSort('權證成交價')">
                  成交價 <span id="sort-權證成交價"></span>
                </th>
                <th onclick="setSort('權證成交量')">
                  成交量 <span id="sort-權證成交量"></span>
                </th>
                <th onclick="setSort('流通在外比例')">
                  流通在外% <span id="sort-流通在外比例"></span>
                </th>
                <th onclick="setSort('買賣價差比率')">
                  價差比% <span id="sort-買賣價差比率"></span>
                </th>
                <th onclick="setSort('最新履約價')">
                  履約價 <span id="sort-最新履約價"></span>
                </th>
                <th onclick="setSort('剩餘天數')">
                  剩餘天數 <span id="sort-剩餘天數"></span>
                </th>
                <th onclick="setSort('價內外程度')">
                  價內外 <span id="sort-價內外程度"></span>
                </th>
                <th onclick="setSort('實質槓桿')">
                  實質槓桿 <span id="sort-實質槓桿"></span>
                </th>
              </tr>
            </thead>
            <tbody id="warrant-list"></tbody>
          </table>
        </div>
        <div id="result-state"></div>
        <div id="loader" class="loader">載入中...</div>

        <div id="pagination-controls" class="pagination">
          <button id="prev-page" class="btn btn-secondary">上一頁</button>
          <span id="page-info">第 1 / 1 頁</span>
          <button id="next-page" class="btn btn-secondary">下一頁</button>
        </div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/shell.js"></script>
    <script>
      let manifest = null;
      let rawData = [];
      let filteredData = [];
      let currentPage = 1;
      const rowsPerPage = 20;
      let sortColumn = "權證成交量";
      let sortDirection = "desc";
      let activeType = "all";
      let loadFailed = false;

      async function init() {
        const stateEl = document.getElementById("result-state");
        stateEl.innerHTML = "";
        let fullManifest;
        try {
          const resp = await fetch(UIData.dataUrl("manifest.json"));
          fullManifest = await resp.json();
        } catch (e) {
          console.error("Error in init:", e);
          document.getElementById("loader").style.display = "none";
          UIData.renderState(stateEl, "error", {
            message: "資料載入失敗",
            onRetry: init,
          });
          return;
        }
        {
          manifest = fullManifest.warrant;

          if (!manifest || !manifest.daily) {
            console.error(
              "Warrant manifest not found or daily data missing",
              fullManifest,
            );
            document.getElementById("loader").style.display = "none";
            UIData.renderState(stateEl, "empty", {
              title: "暫無權證資料",
              hint: "請稍後再試",
            });
            return;
          }

          const urlParams = new URLSearchParams(window.location.search);
          const marketParam = urlParams.get("market");
          if (marketParam === "twse") {
            window.location.href = "twse.html";
            return;
          } else if (marketParam === "tpex") {
            window.location.href = "tpex.html";
            return;
          }

          const datePicker = document.getElementById("date-picker");
          manifest.daily.forEach((date) => {
            const opt = document.createElement("option");
            opt.value = date;
            opt.textContent = date;
            datePicker.appendChild(opt);
          });

          datePicker.onchange = (e) => loadData(e.target.value);
          document.getElementById("warrant-search").oninput = filterData;

          document.getElementById("prev-page").onclick = () => {
            if (currentPage > 1) {
              currentPage--;
              renderTable();
            }
          };
          document.getElementById("next-page").onclick = () => {
            const max = Math.ceil(filteredData.length / rowsPerPage);
            if (currentPage < max) {
              currentPage++;
              renderTable();
            }
          };

          const searchParam = urlParams.get("search");
          if (searchParam) {
            document.getElementById("warrant-search").value = searchParam;
          }

          // Type filter buttons
          document.querySelectorAll(".type-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document
                .querySelectorAll(".type-btn")
                .forEach((b) => b.classList.remove("active"));
              btn.classList.add("active");
              activeType = btn.dataset.type;
              filterData();
            });
          });

          // `/` key focuses search
          document.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
              e.preventDefault();
              document.getElementById("warrant-search").focus();
            }
          });

          if (manifest.daily.length > 0) {
            loadData(manifest.daily[0]);
          }
        }
      }

      async function loadData(date) {
        loadFailed = false;
        document.getElementById("result-state").innerHTML = "";
        document.getElementById("warrant-list").innerHTML = "";
        document.getElementById("loader").style.display = "flex";
        try {
          const resp = await fetch(UIData.dataUrl(`warrant/${date}.json`));
          rawData = await resp.json();
          document.getElementById("last-update").textContent =
            "最後更新: " + date;
          filterData();
        } catch (e) {
          console.error(e);
          rawData = [];
          loadFailed = true;
          document.getElementById("loader").style.display = "none";
          UIData.renderState(document.getElementById("result-state"), "error", {
            message: "資料載入失敗",
            onRetry: () =>
              loadData(document.getElementById("date-picker").value || date),
          });
          filterData();
        } finally {
          document.getElementById("loader").style.display = "none";
        }
      }

      function filterData() {
        const q = document.getElementById("warrant-search").value.toLowerCase();
        filteredData = rawData.filter((w) => {
          try {
            const matchesSearch =
              (w["權證代碼"] || "").toLowerCase().includes(q) ||
              (w["權證名稱"] || "").toLowerCase().includes(q) ||
              (w["標的名稱"] || "").toLowerCase().includes(q) ||
              (w["標的代碼"] || "").toLowerCase().includes(q);
            const matchesType =
              activeType === "all" ||
              (w["認購/認售"] || "").includes(activeType);
            return matchesSearch && matchesType;
          } catch (e) {
            return false;
          }
        });
        currentPage = 1;
        renderTable();
      }

      function setSort(col) {
        if (sortColumn === col) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = col;
          sortDirection = "desc";
        }
        renderTable();
      }

      function renderTable() {
        const list = document.getElementById("warrant-list");
        list.innerHTML = "";
        document.getElementById("warrant-count").textContent =
          filteredData.length;

        filteredData.sort((a, b) => {
          let vA = a[sortColumn];
          let vB = b[sortColumn];

          // Numeric fields
          if (
            [
              "權證成交價",
              "權證成交量",
              "流通在外比例",
              "最新履約價",
              "剩餘天數",
              "實質槓桿",
            ].includes(sortColumn)
          ) {
            vA = parseFloat(vA) || 0;
            vB = parseFloat(vB) || 0;
          }

          if (vA < vB) return sortDirection === "asc" ? -1 : 1;
          if (vA > vB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });

        // Update sort indicators
        document
          .querySelectorAll("th span")
          .forEach((s) => (s.textContent = ""));
        const indicator = document.getElementById("sort-" + sortColumn);
        if (indicator)
          indicator.textContent = sortDirection === "asc" ? " ↑" : " ↓";

        const maxPage = Math.ceil(filteredData.length / rowsPerPage) || 1;
        document.getElementById("page-info").textContent =
          `第 ${currentPage} / ${maxPage} 頁`;

        if (filteredData.length === 0 && !loadFailed) {
          UIData.renderState(document.getElementById("result-state"), "empty", {
            title: "沒有符合的資料",
            hint: "請調整日期或篩選條件",
          });
        } else if (!loadFailed) {
          document.getElementById("result-state").innerHTML = "";
        }

        const start = (currentPage - 1) * rowsPerPage;
        filteredData.slice(start, start + rowsPerPage).forEach((w) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="font-weight: 500;">
                <a href="https://www.warrantwin.com.tw/eyuanta/warrant/Info.aspx?WID=${w["權證代碼"]}" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px dashed var(--text-muted);">${w["權證代碼"]}</a>
            </td>
            <td style="font-weight: 600;">${w["權證名稱"]}</td>
            <td>
                <div style="font-weight: 600;">${w["標的名稱"]}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${w["標的代碼"]}</div>
            </td>
            <td>${w["認購/認售"]}</td>
            <td style="font-weight: 700; color: var(--text);">${w["權證成交價"]}</td>
            <td>${parseInt(w["權證成交量"] || 0).toLocaleString()}</td>
            <td>${w["流通在外比例"]}%</td>
            <td style="color: ${parseFloat(w["買賣價差比率"]) > 1 ? "var(--up)" : "inherit"}">${w["買賣價差比率"] != null ? w["買賣價差比率"] + "%" : "-"}</td>
            <td>${w["最新履約價"]}</td>
            <td>${w["剩餘天數"]}</td>
            <td>${w["價內外程度"]}</td>
            <td style="font-weight: 700;">${w["實質槓桿"]}</td>
          `;
          list.appendChild(tr);
        });
      }

      init();
    </script>
  </body>
</html>
