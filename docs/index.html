<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Observer | 市場觀測站</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          id="header-logo"
          src="assets/logo.png"
          alt="Logo"
          style="height: 40px; width: auto"
          onerror="
            this.style.display = 'none';
            document.getElementById('header-emoji').style.display = 'inline';
          "
        />
        <span id="header-emoji" style="display: none; font-size: 1.5rem"
          >📈</span
        >
        <h1><span class="title-text">Market Observer</span></h1>
        <nav class="nav-bar">
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn active">市場</button>
            <div class="nav-dropdown-menu">
              <a href="twse.html" class="nav-dropdown-item">上市</a>
              <a href="tpex.html" class="nav-dropdown-item">上櫃</a>
              <a href="index.html" class="nav-dropdown-item active">全部</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">策略</button>
            <div class="nav-dropdown-menu">
              <a href="gap.html" class="nav-dropdown-item">跳空漲跌</a>
              <a href="punish.html" class="nav-dropdown-item">處置股票</a>
              <a href="wantgoo.html" class="nav-dropdown-item">基本面</a>
              <a href="volatility.html" class="nav-dropdown-item">區間波動率</a>
              <a href="vcp.html" class="nav-dropdown-item">VCP選股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">權證</button>
            <div class="nav-dropdown-menu">
              <a href="premium-warrant.html" class="nav-dropdown-item"
                >精選權證</a
              >
              <a href="warrant-filter.html" class="nav-dropdown-item"
                >權證篩選</a
              >
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">選股</button>
            <div class="nav-dropdown-menu">
              <a href="screener.html" class="nav-dropdown-item">股票篩選器</a>
              <a href="watchlist.html" class="nav-dropdown-item">精選類股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">個人</button>
            <div class="nav-dropdown-menu">
              <a href="bookmark.html" class="nav-dropdown-item">常用連結</a>
              <a href="portfolio.html" class="nav-dropdown-item">持股試算</a>
            </div>
          </div>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="切換深色模式">
          🌙
        </button>
      </div>
      <div class="header-right">
        <select id="date-picker" class="date-select"></select>
        <div
          id="last-update"
          style="
            font-size: 0.7rem;
            color: var(--hud-text-3);
            font-family: var(--hud-font);
            letter-spacing: 0.05em;
          "
        ></div>
      </div>
    </header>

    <div class="container">
      <div class="grid">
        <div class="main-content">
          <div class="card" style="margin-bottom: 1.5rem">
            <div class="card-title">
              <span>大盤指數趨勢 (上市 / 上櫃)</span>
              <div
                id="index-date"
                style="
                  font-size: 0.65rem;
                  font-weight: normal;
                  color: var(--hud-text-4);
                  text-transform: none;
                  letter-spacing: 0.05em;
                "
              ></div>
            </div>
            <div style="height: 300px; position: relative">
              <canvas id="indexChart"></canvas>
            </div>
          </div>

          <div class="card">
            <div class="card-title card-title-center">
              <span
                >個股行情
                <span id="stock-count" class="badge badge-primary"></span
              ></span>
            </div>
            <div class="search-box">
              <input
                type="text"
                id="stock-search"
                placeholder="搜尋代號或名稱..."
              />
            </div>
            <div
              class="filter-controls"
              style="
                display: flex;
                gap: 0.6rem;
                margin-bottom: 1.25rem;
                flex-wrap: wrap;
                align-items: center;
              "
            >
              <div class="filter-pill">
                <span>市場:</span>
                <select id="market-filter">
                  <option value="all">全部</option>
                  <option value="twse">上市</option>
                  <option value="tpex">上櫃</option>
                </select>
              </div>
              <div class="filter-pill">
                <span>價格:</span>
                <input type="number" id="price-min" placeholder="最小" />
                <span>-</span>
                <input type="number" id="price-max" placeholder="最大" />
              </div>
              <div class="filter-pill">
                <span>成交量 &gt;</span>
                <input
                  type="number"
                  id="volume-min"
                  placeholder="10,000"
                  style="width: 84px"
                />
                <span>張</span>
              </div>
              <div class="filter-pill">
                <span>漲跌幅:</span>
                <input type="number" id="ratio-min" placeholder="最小%" />
                <span>-</span>
                <input type="number" id="ratio-max" placeholder="最大%" />
              </div>
              <div class="filter-pill">
                <span>每頁筆數:</span>
                <select id="rows-per-page">
                  <option value="10" selected>10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>
                </select>
              </div>
              <button id="clear-filters" class="btn btn-secondary">
                清除條件
              </button>
            </div>
            <div class="table-container">
              <table id="stock-table">
                <thead>
                  <tr>
                    <th style="cursor: pointer" onclick="setSort('id')">
                      代號 <span id="sort-id"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('name')">
                      名稱 <span id="sort-name"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('market')">
                      市場 <span id="sort-market"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('close')">
                      成交價 <span id="sort-close"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('diff')">
                      漲跌 <span id="sort-diff"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('ratio')">
                      漲幅 <span id="sort-ratio"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('volume')">
                      成交量(張) <span id="sort-volume"></span>
                    </th>
                  </tr>
                </thead>
                <tbody id="stock-list">
                  <!-- Data will be loaded here -->
                </tbody>
              </table>
            </div>
            <div id="stock-loader" class="loader">載入中...</div>
            <div
              id="pagination-controls"
              style="
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 1.5rem;
                margin-top: 1.5rem;
                padding-top: 1.5rem;
                border-top: 1px solid var(--hud-border-3);
              "
            >
              <button id="prev-page" class="btn btn-secondary">上一頁</button>
              <span
                id="page-info"
                style="
                  font-size: 0.7rem;
                  color: var(--hud-text-3);
                  letter-spacing: 0.05em;
                "
                >第 1 / 1 頁</span
              >
              <button id="next-page" class="btn btn-secondary">下一頁</button>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">市場摘要</div>
              <div id="market-summary" class="stats">
                <div class="stat-item">
                  <span class="stat-label">上市指數</span>
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      align-items: flex-end;
                    "
                  >
                    <span id="summary-index-twse" class="stat-value">--</span>
                    <span
                      id="summary-changes-twse"
                      style="font-weight: 500; font-size: 0.75rem"
                      >--</span
                    >
                  </div>
                </div>
                <div class="stat-item">
                  <span class="stat-label">上櫃指數</span>
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      align-items: flex-end;
                    "
                  >
                    <span id="summary-index-tpex" class="stat-value">--</span>
                    <span
                      id="summary-changes-tpex"
                      style="font-weight: 500; font-size: 0.75rem"
                      >--</span
                    >
                  </div>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交金額(合計)</span>
                  <span id="summary-turnover" class="stat-value">--</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交股數(合計)</span>
                  <span id="summary-volume" class="stat-value">--</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交比數(合計)</span>
                  <span id="summary-transactions" class="stat-value">--</span>
                </div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">
                <div style="display: flex; align-items: center; gap: 0.5rem">
                  <select
                    id="gap-type-switcher"
                    class="date-select"
                    style="
                      font-size: inherit;
                      font-weight: inherit;
                      letter-spacing: inherit;
                      text-transform: inherit;
                      border: none;
                      padding: 0;
                      background: transparent;
                      cursor: pointer;
                      color: inherit;
                      font-family: inherit;
                    "
                  >
                    <option value="gap_jump">跳空上漲</option>
                    <option value="gap_drop">跳空下跌</option>
                  </select>
                  <span id="gap-count" class="badge badge-accent"></span>
                </div>
              </div>
              <div
                style="
                  margin-bottom: 0.75rem;
                  display: flex;
                  justify-content: flex-end;
                "
              >
                <select
                  id="gap-sort"
                  class="date-select"
                  style="font-size: 0.75rem; padding: 0.25rem 0.5rem"
                >
                  <option value="gap_diff-desc">漲點 ↓</option>
                  <option value="gap_diff-asc">漲點 ↑</option>
                  <option value="gap_ratio-desc">漲幅 ↓</option>
                  <option value="gap_ratio-asc">漲幅 ↑</option>
                </select>
              </div>
              <div
                id="gap-list"
                style="max-height: 350px; overflow-y: auto; font-size: 0.875rem"
              >
                <div class="loader" style="height: 100px">載入中...</div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">
                <span>處置股票</span>
                <span id="punish-count" class="badge badge-danger"></span>
              </div>
              <div
                id="punish-list"
                style="max-height: 350px; overflow-y: auto; font-size: 0.875rem"
              >
                <div class="loader" style="height: 100px">載入中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/nerd-grid.js"></script>
    <script>
      const MARKETS = ["twse", "tpex"];
      const MARKET_LABEL = { twse: "上市", tpex: "上櫃" };

      let fullManifest = null;
      let indexDataTwse = [];
      let indexDataTpex = [];
      let currentStockData = [];
      let currentGapData = [];
      let currentPunishData = [];
      let filteredStocks = [];
      let chart = null;

      // Pagination & Sorting State
      let currentPage = 1;
      let rowsPerPage = 10;
      let sortColumn = "id";
      let sortDirection = "asc";

      // Helper to convert ROC date (e.g. 115/05/04) to ISO (2026-05-04)
      function toISO(rocDate) {
        const parts = rocDate.split("/");
        const year = parseInt(parts[0]) + 1911;
        return `${year}-${parts[1]}-${parts[2]}`;
      }

      async function init() {
        try {
          // Apply saved theme before any data/chart rendering so the first
          // paint (including Chart.js colors, which are JS values, not CSS)
          // matches the visitor's saved preference.
          NerdGrid.initThemeToggle();
          NerdGrid.onThemeChange(() => renderChart());

          const response = await fetch("data/manifest.json");
          fullManifest = await response.json();

          const twseDates = fullManifest.twse?.daily_price || [];
          const tpexDates = fullManifest.tpex?.daily_price || [];
          const unionDates = [...new Set([...twseDates, ...tpexDates])]
            .sort()
            .reverse();

          const datePicker = document.getElementById("date-picker");
          datePicker.innerHTML = "";
          unionDates.forEach((date) => {
            const option = document.createElement("option");
            option.value = date;
            option.textContent = date;
            datePicker.appendChild(option);
          });
          datePicker.onchange = (e) => loadStockData(e.target.value);

          await loadIndexData();
          if (unionDates.length > 0) {
            await loadStockData(datePicker.value);
          }

          document
            .getElementById("stock-search")
            .addEventListener("input", filterStocks);
          document
            .getElementById("market-filter")
            .addEventListener("change", filterStocks);
          document
            .getElementById("price-min")
            .addEventListener("input", filterStocks);
          document
            .getElementById("price-max")
            .addEventListener("input", filterStocks);
          document
            .getElementById("volume-min")
            .addEventListener("input", filterStocks);
          document
            .getElementById("ratio-min")
            .addEventListener("input", filterStocks);
          document
            .getElementById("ratio-max")
            .addEventListener("input", filterStocks);
          document
            .getElementById("rows-per-page")
            .addEventListener("change", (e) => {
              rowsPerPage = parseInt(e.target.value, 10);
              currentPage = 1;
              renderStockTable();
            });
          document
            .getElementById("clear-filters")
            .addEventListener("click", () => {
              document.getElementById("stock-search").value = "";
              document.getElementById("market-filter").value = "all";
              document.getElementById("price-min").value = "";
              document.getElementById("price-max").value = "";
              document.getElementById("volume-min").value = "";
              document.getElementById("ratio-min").value = "";
              document.getElementById("ratio-max").value = "";
              document.getElementById("rows-per-page").value = "10";
              rowsPerPage = 10;
              filterStocks();
            });

          // Gap Jump sort listener
          document
            .getElementById("gap-sort")
            .addEventListener("change", renderGapList);

          // Gap Type switcher listener
          document
            .getElementById("gap-type-switcher")
            .addEventListener("change", () => {
              const date = document.getElementById("date-picker").value;
              loadGapData(date);
            });

          // Pagination listeners
          document.getElementById("prev-page").addEventListener("click", () => {
            if (currentPage > 1) {
              currentPage--;
              renderStockTable();
            }
          });
          document.getElementById("next-page").addEventListener("click", () => {
            const maxPage = Math.ceil(filteredStocks.length / rowsPerPage);
            if (currentPage < maxPage) {
              currentPage++;
              renderStockTable();
            }
          });
          NerdGrid.initNavDropdowns();

          // `/` key focuses search
          document.addEventListener("keydown", (e) => {
            if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
              e.preventDefault();
              document.getElementById("stock-search").focus();
            }
          });
        } catch (error) {
          console.error("Initialization error:", error);
        }
      }

      async function loadIndexData() {
        try {
          const [twseRes, tpexRes] = await Promise.all([
            fetch("data/twse/index_history.json"),
            fetch("data/tpex/index_history.json"),
          ]);
          indexDataTwse = twseRes.ok ? await twseRes.json() : [];
          indexDataTpex = tpexRes.ok ? await tpexRes.json() : [];
        } catch (e) {
          console.error("Error loading index_history.json:", e);
          indexDataTwse = [];
          indexDataTpex = [];
        }

        const selectedDate = document.getElementById("date-picker").value;
        updateSummary(selectedDate);
        renderChart();
      }

      function findIndexEntry(arr, date) {
        if (!arr || arr.length === 0) return null;
        return (
          arr.find((item) => toISO(item.date) === date) || arr[arr.length - 1]
        );
      }

      function renderIndexStat(market, entry) {
        const idxEl = document.getElementById(`summary-index-${market}`);
        const chgEl = document.getElementById(`summary-changes-${market}`);
        if (!entry) {
          idxEl.textContent = "--";
          chgEl.textContent = "--";
          return;
        }
        idxEl.textContent = Math.round(entry.index).toLocaleString();
        const changes = parseFloat(entry.changes);
        chgEl.textContent = (changes >= 0 ? "+" : "") + Math.round(changes);
        chgEl.style.color = changes >= 0 ? "var(--hud-up)" : "var(--hud-down)";
      }

      function updateSummary(date) {
        const twseEntry = findIndexEntry(indexDataTwse, date);
        const tpexEntry = findIndexEntry(indexDataTpex, date);

        const lastEntry = twseEntry || tpexEntry;
        document.getElementById("last-update").textContent = lastEntry
          ? `最後更新: ${toISO(lastEntry.date)}`
          : "";

        renderIndexStat("twse", twseEntry);
        renderIndexStat("tpex", tpexEntry);

        const turnover =
          (twseEntry?.turnover || 0) + (tpexEntry?.turnover || 0);
        const volume = (twseEntry?.volume || 0) + (tpexEntry?.volume || 0);
        const transactions =
          (twseEntry?.transactions || 0) + (tpexEntry?.transactions || 0);

        document.getElementById("summary-turnover").textContent =
          Math.round(turnover / 100000000) + " 億";
        document.getElementById("summary-volume").textContent =
          Math.round(volume / 100000000) + " 億";
        document.getElementById("summary-transactions").textContent =
          Math.round(transactions / 10000) + " 萬";
      }

      async function loadStockData(date) {
        updateSummary(date);
        document.getElementById("stock-list").innerHTML = "";
        document.getElementById("stock-loader").style.display = "flex";
        document.getElementById("gap-list").innerHTML =
          '<div class="loader" style="height: 100px">載入中...</div>';
        document.getElementById("punish-list").innerHTML =
          '<div class="loader" style="height: 100px">載入中...</div>';

        try {
          const results = await Promise.all(
            MARKETS.map((m) => {
              const dates = fullManifest[m]?.daily_price || [];
              if (!dates.includes(date)) return Promise.resolve([]);
              return fetch(`data/${m}/daily_price/${date}.json`)
                .then((r) => (r.ok ? r.json() : []))
                .then((arr) => arr.map((s) => ({ ...s, market: m })))
                .catch(() => []);
            }),
          );
          currentStockData = results.flat();

          // Use pre-computed change/change_percent from the API data
          currentStockData.forEach((s) => {
            const hasChange = s.change !== null && s.change !== undefined;
            s.diff = hasChange ? s.change : 0;
            s.ratio = hasChange ? (s.change_percent ?? 0) : 0;
            s.prev_close = hasChange ? s.close - s.change : undefined;
          });

          filterStocks();
          await loadGapData(date);
          await loadPunishData(date);
        } catch (error) {
          console.error("Error loading data:", error);
        } finally {
          document.getElementById("stock-loader").style.display = "none";
        }
      }

      async function loadGapData(date) {
        const type = document.getElementById("gap-type-switcher").value;
        const sortSelect = document.getElementById("gap-sort");

        // Update sort options based on type
        if (type === "gap_jump") {
          sortSelect.innerHTML = `
                <option value="gap_diff-desc">漲點 ↓</option>
                <option value="gap_diff-asc">漲點 ↑</option>
                <option value="gap_ratio-desc">漲幅 ↓</option>
                <option value="gap_ratio-asc">漲幅 ↑</option>
            `;
        } else {
          sortSelect.innerHTML = `
                <option value="gap_diff-asc">跌點 ↓</option>
                <option value="gap_diff-desc">跌點 ↑</option>
                <option value="gap_ratio-asc">跌幅 ↓</option>
                <option value="gap_ratio-desc">跌幅 ↑</option>
            `;
        }

        const results = await Promise.all(
          MARKETS.map((m) => {
            const dates = fullManifest[m]?.[type] || [];
            if (!dates.includes(date)) return Promise.resolve([]);
            return fetch(`data/${m}/${type}/${date}.json`)
              .then((r) => (r.ok ? r.json() : []))
              .then((arr) => arr.map((s) => ({ ...s, market: m })))
              .catch(() => []);
          }),
        );
        currentGapData = results.flat();
        renderGapList();
      }

      async function loadPunishData(date) {
        const results = await Promise.all(
          MARKETS.map((m) => {
            const dates = fullManifest[m]?.daily_punish || [];
            if (!dates.includes(date)) return Promise.resolve([]);
            return fetch(`data/${m}/daily_punish/${date}.json`)
              .then((r) => (r.ok ? r.json() : []))
              .then((arr) => arr.map((s) => ({ ...s, market: m })))
              .catch(() => []);
          }),
        );
        currentPunishData = results.flat();
        renderPunishList();
      }

      function renderGapList() {
        const container = document.getElementById("gap-list");
        const countLabel = document.getElementById("gap-count");
        const sortVal = document.getElementById("gap-sort").value;
        const type = document.getElementById("gap-type-switcher").value;

        container.innerHTML = "";
        countLabel.textContent = currentGapData.length;

        if (currentGapData.length === 0) {
          container.innerHTML =
            '<div style="padding: 1.5rem; color: var(--hud-text-3); text-align: center; font-style: italic;">無符合條件股票</div>';
          return;
        }

        // Copy for sorting
        const data = [...currentGapData];
        const [sortKey, sortDir] = sortVal.split("-");

        data.sort((a, b) => {
          const valA = a[sortKey];
          const valB = b[sortKey];
          return sortDir === "asc" ? valA - valB : valB - valA;
        });

        data.forEach((stock) => {
          const item = document.createElement("div");
          item.className = "list-item";
          item.style.display = "flex";
          item.style.justifyContent = "space-between";
          item.style.alignItems = "center";

          const isUp = type === "gap_jump";
          const priceClass = isUp ? "price-up" : "price-down";
          const diffPrefix = stock.gap_diff > 0 ? "+" : "";

          item.innerHTML = `
                    <div>
                        <div style="font-weight: 700; color: var(--hud-text-1);"><a href="http://cnyes.com/twstock/${stock.id}/analysis/performance" target="_blank" class="stock-link">${stock.name}</a> <a href="stock.html?id=${stock.id}" class="stock-link" style="font-size: 0.75rem; color: var(--hud-text-3); font-weight: normal;">${stock.id}</a> <span class="tag">${MARKET_LABEL[stock.market]}</span></div>
                        <div style="font-size: 0.75rem; color: var(--hud-text-3);">量: ${(stock.volume / 1000).toFixed(0)} 張</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="${priceClass}" style="font-size: 1rem;">${stock.today_close}</div>
                        <div style="font-size: 0.75rem; color: var(--hud-text-3); font-weight: 500;">${diffPrefix}${stock.gap_diff} (${stock.gap_ratio}%)</div>
                    </div>
                `;
          container.appendChild(item);
        });
      }

      function renderPunishList() {
        const container = document.getElementById("punish-list");
        const countLabel = document.getElementById("punish-count");

        container.innerHTML = "";
        countLabel.textContent = currentPunishData.length;

        if (currentPunishData.length === 0) {
          container.innerHTML =
            '<div style="padding: 1.5rem; color: var(--hud-text-3); text-align: center; font-style: italic;">今日無處置股票</div>';
          return;
        }

        currentPunishData.forEach((stock) => {
          const item = document.createElement("div");
          item.className = "list-item";

          item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.25rem;">
                        <div style="font-weight: 700; color: var(--hud-text-1);"><a href="http://cnyes.com/twstock/${stock.id}/analysis/performance" target="_blank" class="stock-link">${stock.name}</a> <a href="stock.html?id=${stock.id}" class="stock-link" style="font-size: 0.75rem; color: var(--hud-text-3); font-weight: normal;">${stock.id}</a> <span class="tag">${MARKET_LABEL[stock.market]}</span></div>
                        <span class="tag tag-danger" style="margin: 0;">${stock.measure}</span>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--hud-text-3); display: flex; justify-content: space-between;">
                        <span>期間: ${stock.from} ~ ${stock.to}</span>
                        <span>次數: ${stock.accumulated}</span>
                    </div>
                `;
          container.appendChild(item);
        });
      }

      function setSort(column) {
        if (sortColumn === column) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = column;
          sortDirection = "asc";
        }
        currentPage = 1;
        renderStockTable();
      }

      function renderStockTable() {
        const stocks = filteredStocks;
        const tbody = document.getElementById("stock-list");
        tbody.innerHTML = "";
        document.getElementById("stock-count").textContent = stocks.length;

        stocks.sort((a, b) => {
          let valA = a[sortColumn];
          let valB = b[sortColumn];

          // Handle n/a cases for sorting
          if (sortColumn === "ratio") {
            valA = a.prev_close ? a.ratio : -Infinity;
            valB = b.prev_close ? b.ratio : -Infinity;
          } else if (sortColumn === "diff") {
            valA = a.prev_close ? a.close - a.prev_close : -Infinity;
            valB = b.prev_close ? b.close - b.prev_close : -Infinity;
          }

          if (typeof valA === "string") {
            return sortDirection === "asc"
              ? valA.localeCompare(valB)
              : valB.localeCompare(valA);
          } else {
            return sortDirection === "asc" ? valA - valB : valB - valA;
          }
        });

        ["id", "name", "market", "close", "diff", "ratio", "volume"].forEach(
          (col) => {
            const span = document.getElementById(`sort-${col}`);
            if (span) {
              span.textContent =
                col === sortColumn ? (sortDirection === "asc" ? "↑" : "↓") : "";
              span.style.color = col === sortColumn ? "var(--hud-text-1)" : "";
            }
          },
        );

        const maxPage = Math.ceil(stocks.length / rowsPerPage) || 1;
        if (currentPage > maxPage) currentPage = maxPage;
        document.getElementById("page-info").textContent =
          `第 ${currentPage} / ${maxPage} 頁`;
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled = currentPage === maxPage;

        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = stocks.slice(start, end);

        pageData.forEach((stock) => {
          const hasPrev = stock.prev_close !== undefined;
          const diff = stock.diff;
          const diffClass =
            diff > 0 ? "price-up" : diff < 0 ? "price-down" : "";
          const diffPrefix = diff > 0 ? "+" : "";
          const diffText = hasPrev ? diff.toFixed(2) : "n/a";

          const ratioText = hasPrev
            ? (stock.ratio >= 0 ? "+" : "") + stock.ratio.toFixed(2) + "%"
            : "n/a";
          const ratioClass =
            stock.ratio > 0 ? "price-up" : stock.ratio < 0 ? "price-down" : "";

          const marketBadge =
            stock.market === "twse"
              ? '<span class="badge badge-primary" style="margin-left: 0;">上市</span>'
              : '<span class="badge badge-accent" style="margin-left: 0;">上櫃</span>';

          const tr = document.createElement("tr");
          tr.innerHTML = `
                    <td style="font-weight: 500;"><a href="stock.html?id=${stock.id}" class="stock-link">${stock.id}</a></td>
                    <td style="font-weight: 600;"><a href="http://cnyes.com/twstock/${stock.id}/analysis/performance" target="_blank" class="stock-link">${stock.name}</a></td>
                    <td>${marketBadge}</td>
                    <td style="font-weight: 600;">${stock.close}</td>
                    <td class="${diffClass}" style="font-weight: 700;">${diff !== null ? diffPrefix + diffText : "n/a"}</td>
                    <td class="${ratioClass}" style="font-weight: 700;">${ratioText}</td>
                    <td style="color: var(--hud-text-3);">${(stock.volume / 1000).toLocaleString(undefined, { maximumFractionDigits: 0 })} 張</td>
                `;
          tbody.appendChild(tr);
        });
      }

      function filterStocks() {
        const query = document
          .getElementById("stock-search")
          .value.toLowerCase();
        const marketFilter = document.getElementById("market-filter").value;
        const minPrice =
          parseFloat(document.getElementById("price-min").value) || 0;
        const maxPrice =
          parseFloat(document.getElementById("price-max").value) || Infinity;
        const minVolume =
          (parseInt(document.getElementById("volume-min").value) || 0) * 1000;
        const minRatio = parseFloat(document.getElementById("ratio-min").value);
        const maxRatio = parseFloat(document.getElementById("ratio-max").value);
        const hasMinRatio = !isNaN(minRatio);
        const hasMaxRatio = !isNaN(maxRatio);

        filteredStocks = currentStockData.filter((s) => {
          const matchesSearch =
            s.id.toLowerCase().includes(query) ||
            s.name.toLowerCase().includes(query);
          const matchesMarket =
            marketFilter === "all" || s.market === marketFilter;
          const matchesPrice = s.close >= minPrice && s.close <= maxPrice;
          const matchesVolume = s.volume >= minVolume;
          const matchesRatio =
            (!hasMinRatio || s.ratio >= minRatio) &&
            (!hasMaxRatio || s.ratio <= maxRatio);
          return (
            matchesSearch &&
            matchesMarket &&
            matchesPrice &&
            matchesVolume &&
            matchesRatio
          );
        });

        currentPage = 1;
        renderStockTable();
      }

      function renderChart() {
        const ctx = document.getElementById("indexChart").getContext("2d");

        if (chart) chart.destroy();

        const dateMap = new Map();
        indexDataTwse.forEach((d) => dateMap.set(toISO(d.date), d.date));
        indexDataTpex.forEach((d) => dateMap.set(toISO(d.date), d.date));
        const isoDates = [...dateMap.keys()].sort();
        const labels = isoDates.map((iso) => dateMap.get(iso));

        const twseByIso = new Map(
          indexDataTwse.map((d) => [toISO(d.date), d.index]),
        );
        const tpexByIso = new Map(
          indexDataTpex.map((d) => [toISO(d.date), d.index]),
        );

        const twseSeries = isoDates.map((iso) =>
          twseByIso.has(iso) ? twseByIso.get(iso) : null,
        );
        const tpexSeries = isoDates.map((iso) =>
          tpexByIso.has(iso) ? tpexByIso.get(iso) : null,
        );

        const c = NerdGrid.chartColors();
        const monoFont = { family: "JetBrains Mono, monospace", size: 10 };

        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "上市加權指數",
                data: twseSeries,
                borderColor: c.seriesA,
                backgroundColor: c.seriesA,
                borderWidth: 1.5,
                fill: false,
                tension: 0.15,
                pointRadius: 0,
                pointHoverRadius: 3,
                pointHoverBackgroundColor: c.seriesA,
                yAxisID: "y",
                spanGaps: true,
              },
              {
                label: "上櫃指數",
                data: tpexSeries,
                borderColor: c.seriesB,
                backgroundColor: c.seriesB,
                borderWidth: 1.5,
                fill: false,
                tension: 0.15,
                pointRadius: 0,
                pointHoverRadius: 3,
                pointHoverBackgroundColor: c.seriesB,
                yAxisID: "y1",
                spanGaps: true,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: "top",
                align: "end",
                labels: {
                  boxWidth: 10,
                  boxHeight: 1,
                  font: monoFont,
                  color: c.tick,
                },
              },
              tooltip: {
                backgroundColor: c.tooltipBg,
                borderColor: c.tooltipBorder,
                borderWidth: 1,
                padding: 10,
                titleFont: { family: "JetBrains Mono, monospace", size: 11 },
                bodyFont: { family: "JetBrains Mono, monospace", size: 11 },
                titleColor: c.tooltipText,
                bodyColor: c.tooltipText,
                displayColors: false,
              },
            },
            scales: {
              y: {
                beginAtZero: false,
                position: "left",
                grid: { color: c.gridH },
                border: { color: c.gridH },
                ticks: { font: monoFont, color: c.seriesA },
              },
              y1: {
                beginAtZero: false,
                position: "right",
                grid: { display: false },
                border: { color: c.gridH },
                ticks: { font: monoFont, color: c.seriesB },
              },
              x: {
                grid: { color: c.gridV },
                border: { color: c.gridH },
                ticks: {
                  font: monoFont,
                  color: c.tick,
                  maxRotation: 45,
                  minRotation: 45,
                },
              },
            },
          },
        });
      }

      init();
    </script>
  </body>
</html>
