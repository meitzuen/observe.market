<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個股歷史走勢 | Market Observer</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      @media (max-width: 480px) {
        h1 span.title-text {
          display: none;
        }
      }

      .btn:hover {
        background: var(--hud-hover-bg);
      }

      .btn-secondary:hover {
        background: var(--hud-text-3);
      }

      .stock-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }

      .stock-header h2 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
      }

      .back-link {
        color: var(--hud-text-3);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .back-link:hover {
        color: var(--hud-text-1);
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--hud-text-3);
      }

      .empty-state a {
        color: var(--hud-text-1);
        font-weight: 600;
      }
    </style>

      <div class="header-left">
        <img
          id="header-logo"
          src="assets/logo.png"
          alt="Logo"
          style="height: 40px; width: auto"
          onerror="
            this.style.display = 'none';
            document.getElementById('header-emoji').style.display = 'inline';
          "
        />
        <span id="header-emoji" style="display: none; font-size: 1.5rem"
          >📈</span
        >
        <h1><span class="title-text">Market Observer</span></h1>
        <nav class="nav-bar">
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">市場</button>
            <div class="nav-dropdown-menu">
              <a href="twse.html" class="nav-dropdown-item">上市</a>
              <a href="tpex.html" class="nav-dropdown-item">上櫃</a>
              <a href="index.html" class="nav-dropdown-item">全部</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">策略</button>
            <div class="nav-dropdown-menu">
              <a href="gap.html" class="nav-dropdown-item">跳空漲跌</a>
              <a href="punish.html" class="nav-dropdown-item">處置股票</a>
              <a href="wantgoo.html" class="nav-dropdown-item">基本面</a>
              <a href="volatility.html" class="nav-dropdown-item">區間波動率</a>
              <a href="vcp.html" class="nav-dropdown-item">VCP選股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">權證</button>
            <div class="nav-dropdown-menu">
              <a href="premium-warrant.html" class="nav-dropdown-item"
                >精選權證</a
              >
              <a href="warrant-filter.html" class="nav-dropdown-item"
                >權證篩選</a
              >
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">選股</button>
            <div class="nav-dropdown-menu">
              <a href="screener.html" class="nav-dropdown-item">股票篩選器</a>
              <a href="watchlist.html" class="nav-dropdown-item">精選類股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">個人</button>
            <div class="nav-dropdown-menu">
              <a href="bookmark.html" class="nav-dropdown-item">常用連結</a>
              <a href="portfolio.html" class="nav-dropdown-item">持股試算</a>
            </div>
          </div>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="切換深色模式">
          🌙
        </button>
      </div>
    </header>

    <div class="container">
      <div id="content-area">
        <div class="loader">載入中...</div>
      </div>
    </div>

    <script src="assets/nerd-grid.js"></script>
    <script>
      let chart = null;
      let candleSeries = null;
      let volumeSeries = null;
      let chartResizeObserver = null;

      function backHref(market) {
        return market === "tpex" ? "tpex.html" : "twse.html";
      }

      function showEmptyState(title, message, backHref) {
        document.getElementById("content-area").innerHTML = `
          <div class="card">
            <div class="empty-state">
              <h2 style="color: var(--hud-text-1); margin-bottom: 0.5rem;">${title}</h2>
              <p>${message}</p>
              <a href="${backHref}">&larr; 返回股票列表</a>
            </div>
          </div>
        `;
      }

      async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");

        if (!id) {
          showEmptyState(
            "缺少股票代號",
            "請由股票列表點擊股票代號以查看歷史走勢。",
            "twse.html",
          );
          return;
        }

        let stockInfo;
        try {
          const infoResponse = await fetch("data/stock_info.json");
          const allStockInfo = await infoResponse.json();
          stockInfo = allStockInfo[id];
        } catch (e) {
          console.error("Error loading stock_info.json:", e);
        }

        if (!stockInfo) {
          showEmptyState(
            "查無此股票",
            `找不到股票代號 ${id} 的基本資料。`,
            "twse.html",
          );
          return;
        }

        const market = stockInfo.type === "tpex" ? "tpex" : "twse";

        let history = [];
        try {
          const historyResponse = await fetch(
            `data/${market}/stock_history/${id}.json`,
          );
          if (historyResponse.ok) {
            history = await historyResponse.json();
          }
        } catch (e) {
          console.error("Error loading stock_history:", e);
          history = [];
        }

        if (!history || history.length === 0) {
          showEmptyState(
            "尚無歷史資料",
            `${stockInfo.name} (${id}) 目前尚無歷史股價資料。`,
            backHref(market),
          );
          return;
        }

        renderStock(id, stockInfo, market, history);
        NerdGrid.initThemeToggle();
        NerdGrid.onThemeChange(() => {
          if (chart) renderPriceChart(history);
        });
        NerdGrid.initNavDropdowns();
      }

      function renderStock(id, stockInfo, market, history) {
        const marketTag = market === "tpex" ? "上櫃" : "上市";
        const latest = history[history.length - 1];
        const prev = history.length > 1 ? history[history.length - 2] : null;

        const diff = prev ? latest.close - prev.close : null;
        const ratio = prev && prev.close ? (diff / prev.close) * 100 : null;
        const diffClass =
          diff === null
            ? ""
            : diff > 0
              ? "price-up"
              : diff < 0
                ? "price-down"
                : "";
        const diffPrefix = diff !== null && diff > 0 ? "+" : "";
        const diffText =
          diff === null ? "n/a" : `${diffPrefix}${diff.toFixed(2)}`;
        const ratioText =
          ratio === null
            ? "n/a"
            : `${ratio >= 0 ? "+" : ""}${ratio.toFixed(2)}%`;

        const recentRows = history.slice(-20).reverse();

        const tableRows = recentRows
          .map((p) => {
            return `
              <tr>
                <td>${p.date}</td>
                <td>${p.open ?? "n/a"}</td>
                <td>${p.high ?? "n/a"}</td>
                <td>${p.low ?? "n/a"}</td>
                <td style="font-weight:600;">${p.close ?? "n/a"}</td>
                <td style="color: var(--hud-text-3);">${
                  p.volume != null
                    ? (p.volume / 1000).toLocaleString(undefined, {
                        maximumFractionDigits: 0,
                      })
                    : "n/a"
                } 張</td>
              </tr>
            `;
          })
          .join("");

        document.getElementById("content-area").innerHTML = `
          <a class="back-link" href="${backHref(market)}">&larr; 返回</a>
          <div class="card">
            <div class="stock-header">
              <h2>${stockInfo.name} (${id})</h2>
              <span class="badge ${market === "tpex" ? "badge-accent" : "badge-primary"}">${marketTag}</span>
            </div>
            <div class="stats">
              <div class="stat-item" style="border-left: 4px solid var(--hud-text-1);">
                <span class="stat-label">最新收盤</span>
                <span class="stat-value">${latest.close ?? "n/a"}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">漲跌</span>
                <span class="stat-value ${diffClass}">${diffText}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">漲跌幅</span>
                <span class="stat-value ${diffClass}">${ratioText}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">資料日期</span>
                <span class="stat-value" style="font-size: 1rem;">${latest.date}</span>
              </div>
            </div>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;">
              <a
                href="http://cnyes.com/twstock/${id}/analysis/performance"
                target="_blank"
                class="btn btn-secondary"
                >在 cnyes 查看更多</a
              >
              <a
                href="https://www.moneydj.com/kmdj/wiki/wikisubjectlist.aspx?a=TW.${id}"
                target="_blank"
                class="btn btn-secondary"
                >在 moneydj 查看產業資訊</a
              >
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>歷史股價走勢</span>
            </div>
            <div id="priceChart" style="height: 360px; position: relative"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>近期交易明細（最近 ${recentRows.length} 個交易日）</span>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>開盤</th>
                    <th>最高</th>
                    <th>最低</th>
                    <th>收盤</th>
                    <th>成交量</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;

        renderPriceChart(history);
      }

      function renderPriceChart(data) {
        const container = document.getElementById("priceChart");

        if (chartResizeObserver) {
          chartResizeObserver.disconnect();
          chartResizeObserver = null;
        }
        if (chart) {
          chart.remove();
          chart = null;
        }

        // LightweightCharts draws to <canvas>, which can't resolve CSS
        // custom properties — pull already-resolved values instead.
        const c = NerdGrid.chartColors();
        const upColor = c.up;
        const downColor = c.down;
        const textColor = c.tick;
        const gridColor = c.gridH;

        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          layout: {
            background: { type: "solid", color: "transparent" },
            textColor: textColor,
          },
          grid: {
            vertLines: { visible: false },
            horzLines: { color: gridColor },
          },
          rightPriceScale: {
            borderVisible: false,
          },
          timeScale: {
            borderVisible: false,
            timeVisible: false,
            rightOffset: 2,
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
          },
        });

        candleSeries = chart.addCandlestickSeries({
          upColor: upColor,
          downColor: downColor,
          borderVisible: false,
          wickUpColor: upColor,
          wickDownColor: downColor,
          priceScaleId: "right",
        });
        candleSeries.priceScale().applyOptions({
          scaleMargins: { top: 0.05, bottom: 0.25 },
        });

        volumeSeries = chart.addHistogramSeries({
          priceFormat: { type: "volume" },
          priceScaleId: "",
        });
        volumeSeries.priceScale().applyOptions({
          scaleMargins: { top: 0.8, bottom: 0 },
        });

        candleSeries.setData(
          data.map((d) => ({
            time: d.date,
            open: d.open,
            high: d.high,
            low: d.low,
            close: d.close,
          })),
        );

        volumeSeries.setData(
          data.map((d) => ({
            time: d.date,
            value: d.volume ?? 0,
            color: d.close >= d.open ? upColor : downColor,
          })),
        );

        chart.timeScale().fitContent();

        chartResizeObserver = new ResizeObserver((entries) => {
          if (!entries.length || !chart) return;
          const { width, height } = entries[0].contentRect;
          chart.applyOptions({ width, height });
        });
        chartResizeObserver.observe(container);
      }

      init();
    </script>
  </body>
</html>
