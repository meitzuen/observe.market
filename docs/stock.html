<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>個股歷史走勢 | Market Observer</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <style>

      .stock-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.5rem;
      }

      .back-link {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .back-link:hover {
        color: var(--text);
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
      }

      .empty-state a {
        color: var(--text);
        font-weight: 600;
      }

      .period-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1.1rem;
      }

      .period-tab {
        padding: 0.35rem 0.9rem;
        border-radius: 2px;
        border: 1px solid var(--border);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        background: none;
        color: var(--text-muted);
        font-family: var(--font);
        transition: all 0.2s;
      }

      .period-tab.active {
        background: transparent;
        border-color: var(--text);
        color: var(--text);
      }

      .period-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.1rem;
      }

      @media (max-width: 480px) {
        .period-controls {
          grid-template-columns: 1fr;
        }
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .filter-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .filter-input {
        min-width: 0;
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 2px;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
        background: var(--bg);
        color: var(--text);
        font-family: inherit;
      }

      .filter-input:focus {
        border-color: var(--text);
        background: var(--surface);
      }

      .period-hint {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.75rem;
      }

      .concept-tags {
        margin-top: 0.85rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }

      .concept-tags-more {
        background: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-muted);
        font-family: var(--font);
        font-size: 0.62rem;
        padding: 0.05rem 0.4rem;
        cursor: pointer;
      }
      .concept-tags-more:hover {
        color: var(--text);
        border-color: var(--border-strong);
      }

      .watchlist-picker-wrap {
        position: relative;
        display: inline-block;
      }

      .watchlist-picker {
        display: none;
        position: absolute;
        top: calc(100% + 0.4rem);
        left: 0;
        min-width: 12rem;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        padding: 0.35rem;
        box-sizing: border-box;
        z-index: 50;
        flex-direction: column;
        gap: 0.15rem;
        /* JS caps this to exactly ~10 rows once items render; this is just
           a safety net so a long list never blows out past the viewport. */
        max-height: 70vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }

      .watchlist-picker::-webkit-scrollbar {
        width: 6px;
      }
      .watchlist-picker::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 3px;
      }
      .watchlist-picker::-webkit-scrollbar-track {
        background: transparent;
      }

      .watchlist-picker.open {
        display: flex;
      }

      .watchlist-picker-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-radius: var(--radius);
        color: var(--text);
        font-family: var(--font);
        font-size: 0.75rem;
        padding: 0.45rem 0.6rem;
        cursor: pointer;
      }
      .watchlist-picker-item:hover:not(:disabled) {
        background: var(--hover);
        color: var(--text);
      }
      .watchlist-picker-item:disabled {
        color: var(--text-muted);
        cursor: default;
      }

      .watchlist-picker-empty {
        padding: 0.6rem 0.7rem;
        font-size: 0.75rem;
        color: var(--text-muted);
        line-height: 1.6;
      }
      .watchlist-picker-empty a {
        color: var(--text);
        font-weight: 600;
      }

      .chart-legend {
        display: flex;
        gap: 0.9rem;
        font-size: 0.65rem;
        letter-spacing: 0;
        text-transform: none;
        font-weight: 400;
        font-family: var(--font);
      }
    </style>
  </head>
  <body>
    <header id="site-header"></header>

    <div class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title" id="stock-title">個股歷史走勢</h1>
          <p class="page-subtitle" id="stock-subtitle">歷史股價走勢、區間漲跌幅與近期成交</p>
        </div>
      </div>
      <div id="content-area">
        <div class="loader">載入中...</div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/chart-theme.js"></script>
    <script src="assets/shell.js"></script>
    <script>
      const isAdmin = new URLSearchParams(location.search).get("admin") === "True";
      let chart = null;
      let candleSeries = null;
      let volumeSeries = null;
      let chartResizeObserver = null;
      let historyData = [];
      let indexHistory = [];
      let indexLabel = "";

      const API_BASE = "https://market.smallplum.xyz";
      let watchlistsCache = null;

      function backHref(market) {
        return market === "tpex" ? "tpex.html" : "twse.html";
      }

      // Index history dates are ROC calendar ("115/08/13") — convert to ISO
      // so they line up with the stock's own date strings.
      function rocToISO(rocStr) {
        const m = /^(\d+)\/(\d{1,2})\/(\d{1,2})$/.exec(rocStr || "");
        if (!m) return null;
        const year = Number(m[1]) + 1911;
        return `${year}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
      }

      // Escape any text that originates from the URL (or other untrusted
      // input) before it reaches innerHTML / attributes.
      function esc(v) {
        return String(v).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      function showEmptyState(title, message, backHref) {
        document.getElementById("content-area").innerHTML = `
          <div class="card">
            <div class="empty-state">
              <h2 style="color: var(--text); margin-bottom: 0.5rem;">${esc(title)}</h2>
              <p>${esc(message)}</p>
              <a href="${esc(backHref)}">&larr; 返回股票列表</a>
            </div>
          </div>
        `;
      }

      function showLoadError() {
        UIData.renderState(document.getElementById("content-area"), "error", {
          message: "資料載入失敗",
          onRetry: () => init(),
        });
      }

      async function init() {
        document.getElementById("content-area").innerHTML =
          '<div class="loader">載入中...</div>';
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");

        if (!id) {
          showEmptyState(
            "缺少股票代號",
            "請由股票列表點擊股票代號以查看歷史走勢。",
            "twse.html",
          );
          return;
        }

        let stockInfo;
        try {
          const infoResponse = await fetch("data/stock_info.json");
          if (!infoResponse.ok) throw new Error("HTTP " + infoResponse.status);
          const allStockInfo = await infoResponse.json();
          // own-property check: ids like "constructor" must not resolve
          stockInfo = Object.prototype.hasOwnProperty.call(allStockInfo, id)
            ? allStockInfo[id]
            : undefined;
        } catch (e) {
          console.error("Error loading stock_info.json:", e);
          showLoadError();
          return;
        }

        if (!stockInfo) {
          showEmptyState(
            "查無此股票",
            `找不到股票代號 ${id} 的基本資料。`,
            "twse.html",
          );
          return;
        }

        const market = stockInfo.type === "tpex" ? "tpex" : "twse";
        document.title = `${stockInfo.name} (${id}) | Market Observer`;
        document.getElementById("stock-title").textContent = `${stockInfo.name} (${id})`;

        let history = [];
        try {
          const historyResponse = await fetch(
            `data/${market}/stock_history/${id}.json`,
          );
          if (historyResponse.ok) {
            history = await historyResponse.json();
          } else if (historyResponse.status !== 404) {
            throw new Error("HTTP " + historyResponse.status);
          }
        } catch (e) {
          console.error("Error loading stock_history:", e);
          showLoadError();
          return;
        }

        if (!history || history.length === 0) {
          showEmptyState(
            "尚無歷史資料",
            `${stockInfo.name} (${id}) 目前尚無歷史股價資料。`,
            backHref(market),
          );
          return;
        }

        historyData = history;

        // Concept tags, 處置 status, and the market index are all "nice to
        // have" context — never let one failing block the core page render.
        const [concepts, punishRecords] = await Promise.all([
          loadConceptTags(id),
          loadPunishRecords(id, market),
        ]);
        await loadIndexHistory(market);

        renderStock(id, stockInfo, market, history, concepts, punishRecords);
        initPeriodFilter(history);
        initWatchlistPicker(id);
      }

      async function loadConceptTags(id) {
        try {
          const res = await fetch("data/concept/stock_concepts.json");
          if (!res.ok) return [];
          const concepts = await res.json();
          return concepts
            .filter((c) => c.items?.some((it) => it.stock_id === id))
            .map((c) => c.name);
        } catch (e) {
          console.error("Error loading stock_concepts.json:", e);
          return [];
        }
      }

      async function loadPunishRecords(id, market) {
        try {
          const res = await fetch(`data/${market}/punish_history.json`);
          if (!res.ok) return [];
          const all = await res.json();
          return all
            .filter((p) => p.id === id)
            .sort((a, b) => (a.from < b.from ? 1 : a.from > b.from ? -1 : 0));
        } catch (e) {
          console.error("Error loading punish_history.json:", e);
          return [];
        }
      }

      async function loadIndexHistory(market) {
        indexLabel = market === "tpex" ? "櫃買指數" : "加權指數";
        try {
          const res = await fetch(`data/${market}/index_history.json`);
          if (!res.ok) {
            indexHistory = [];
            return;
          }
          const raw = await res.json();
          indexHistory = raw
            .map((r) => ({ date: rocToISO(r.date), close: r.index }))
            .filter((r) => r.date && r.close != null)
            .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
        } catch (e) {
          console.error("Error loading index_history.json:", e);
          indexHistory = [];
        }
      }

      function renderStock(id, stockInfo, market, history, concepts, punishRecords) {
        const marketTag = market === "tpex" ? "上櫃" : "上市";
        const latest = history[history.length - 1];
        const prev = history.length > 1 ? history[history.length - 2] : null;

        const activePunish = (punishRecords || []).find(
          (p) => p.from <= latest.date && latest.date <= p.to,
        );
        const punishBadge = activePunish
          ? `<span class="tag tag-danger" title="${activePunish.measure}（${activePunish.from} ~ ${activePunish.to}）">⚠ 處置中</span>`
          : punishRecords && punishRecords.length
            ? `<span class="tag" title="最近一次：${punishRecords[0].measure}（${punishRecords[0].from} ~ ${punishRecords[0].to}）">曾處置</span>`
            : "";

        const conceptTagsHtml = concepts && concepts.length
          ? `<div class="concept-tags" id="concept-tags">
              ${concepts
                .map(
                  (c, i) =>
                    `<span class="tag"${i >= 10 ? ' style="display:none;" data-extra="1"' : ""}>${c}</span>`,
                )
                .join("")}
              ${
                concepts.length > 10
                  ? `<button class="concept-tags-more" id="concept-tags-toggle">+${concepts.length - 10} 更多</button>`
                  : ""
              }
            </div>`
          : "";

        const diff = prev ? latest.close - prev.close : null;
        const ratio = prev && prev.close ? (diff / prev.close) * 100 : null;
        const diffClass =
          diff === null
            ? ""
            : diff > 0
              ? "price-up"
              : diff < 0
                ? "price-down"
                : "";
        const diffPrefix = diff !== null && diff > 0 ? "+" : "";
        const diffText =
          diff === null ? "n/a" : `${diffPrefix}${diff.toFixed(2)}`;
        const ratioText =
          ratio === null
            ? "n/a"
            : `${ratio >= 0 ? "+" : ""}${ratio.toFixed(2)}%`;

        const recentRows = history.slice(-20).reverse();

        const tableRows = recentRows
          .map((p) => {
            return `
              <tr>
                <td>${p.date}</td>
                <td>${p.open ?? "n/a"}</td>
                <td>${p.high ?? "n/a"}</td>
                <td>${p.low ?? "n/a"}</td>
                <td style="font-weight:600;">${p.close ?? "n/a"}</td>
                <td style="color: var(--text-muted);">${
                  p.volume != null
                    ? (p.volume / 1000).toLocaleString(undefined, {
                        maximumFractionDigits: 0,
                      })
                    : "n/a"
                } 張</td>
              </tr>
            `;
          })
          .join("");

        document.getElementById("content-area").innerHTML = `
          <a class="back-link" href="${backHref(market)}">&larr; 返回</a>
          <div class="card">
            <div class="stock-header">
              <span class="badge ${market === "tpex" ? "badge-accent" : "badge-primary"}">${marketTag}</span>
              ${punishBadge}
            </div>
            <div class="stats">
              <div class="stat-item" style="border-left: 4px solid var(--text);">
                <span class="stat-label">最新收盤</span>
                <span class="stat-value">${latest.close ?? "n/a"}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">漲跌</span>
                <span class="stat-value ${diffClass}">${diffText}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">漲跌幅</span>
                <span class="stat-value ${diffClass}">${ratioText}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">資料日期</span>
                <span class="stat-value" style="font-size: 1rem;">${latest.date}</span>
              </div>
            </div>
            ${conceptTagsHtml}
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem;">
              ${
                isAdmin
                  ? `<div class="watchlist-picker-wrap">
                <button class="btn" id="btn-add-watchlist">＋ 加入自選股</button>
                <div class="watchlist-picker" id="watchlist-picker"></div>
              </div>
              <a href="portfolio.html?add=${id}" class="btn">＋ 加入持股試算</a>`
                  : ""
              }
              <a
                href="http://cnyes.com/twstock/${id}/analysis/performance"
                target="_blank"
                class="btn btn-secondary"
                >前往『 CNYES 』</a
              >
              <a
                href="https://www.moneydj.com/kmdj/wiki/wikisubjectlist.aspx?a=TW.${id}"
                target="_blank"
                class="btn btn-secondary"
                >前往『 MONEYDJ 』</a
              >
              <a
                href="https://uc913.com/stock-${id}"
                target="_blank"
                class="btn btn-secondary"
                >前往『 UC個股筆記 』</a
              >
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>區間漲跌幅</span>
            </div>
            <div class="period-tabs" id="period-tabs">
              <button class="period-tab" data-period="1w">1週</button>
              <button class="period-tab" data-period="1m">1個月</button>
              <button class="period-tab" data-period="3m">3個月</button>
              <button class="period-tab" data-period="6m">6個月</button>
              <button class="period-tab" data-period="1y">1年</button>
              <button class="period-tab" data-period="ytd">今年以來</button>
              <button class="period-tab" data-period="all">全部</button>
            </div>
            <div class="period-controls">
              <div class="filter-group">
                <span class="filter-label">起始日期</span>
                <input type="date" id="period-from" class="filter-input" />
              </div>
              <div class="filter-group">
                <span class="filter-label">結束日期</span>
                <input type="date" id="period-to" class="filter-input" />
              </div>
            </div>
            <div class="stats" id="period-stats"></div>
            <div class="period-hint" id="period-hint"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>歷史股價走勢</span>
              <span class="chart-legend">
                <span id="ma5-legend">— MA5</span>
                <span id="ma20-legend">— MA20</span>
                <span id="ma60-legend">— MA60</span>
              </span>
            </div>
            <div id="priceChart" style="height: 360px; position: relative"></div>
          </div>

          <div class="card">
            <div class="card-title">
              <span>近期交易明細（最近 ${recentRows.length} 個交易日）</span>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>日期</th>
                    <th>開盤</th>
                    <th>最高</th>
                    <th>最低</th>
                    <th>收盤</th>
                    <th>成交量</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;

        renderPriceChart(history);

        const tagsToggle = document.getElementById("concept-tags-toggle");
        if (tagsToggle) {
          tagsToggle.addEventListener("click", () => {
            document
              .querySelectorAll('#concept-tags [data-extra="1"]')
              .forEach((el) => (el.style.display = ""));
            tagsToggle.style.display = "none";
          });
        }
      }

      function parseISODate(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }

      function toISODate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      // Trading days only exist on some dates, so a requested range is
      // clamped to the nearest data points inside [fromStr, toStr].
      function findPeriodBounds(history, fromStr, toStr) {
        const startEntry = history.find((p) => p.date >= fromStr && p.date <= toStr);
        let endEntry = null;
        for (let i = history.length - 1; i >= 0; i--) {
          if (history[i].date <= toStr && history[i].date >= fromStr) {
            endEntry = history[i];
            break;
          }
        }
        if (!startEntry || !endEntry) return null;
        return { startEntry, endEntry };
      }

      function initPeriodFilter(history) {
        if (!history || history.length === 0) return;

        const first = history[0];
        const last = history[history.length - 1];
        const fromEl = document.getElementById("period-from");
        const toEl = document.getElementById("period-to");

        fromEl.min = toEl.min = first.date;
        fromEl.max = toEl.max = last.date;

        document.querySelectorAll(".period-tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".period-tab")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            applyPeriodPreset(btn.dataset.period);
          });
        });

        fromEl.addEventListener("change", () => {
          document
            .querySelectorAll(".period-tab")
            .forEach((b) => b.classList.remove("active"));
          updatePeriodStats();
        });
        toEl.addEventListener("change", () => {
          document
            .querySelectorAll(".period-tab")
            .forEach((b) => b.classList.remove("active"));
          updatePeriodStats();
        });

        // Default view: most recent month.
        const defaultTab = document.querySelector('.period-tab[data-period="1m"]');
        if (defaultTab) defaultTab.classList.add("active");
        applyPeriodPreset("1m");
      }

      function applyPeriodPreset(period) {
        if (!historyData.length) return;
        const first = historyData[0];
        const last = historyData[historyData.length - 1];
        const endDate = parseISODate(last.date);
        const minDate = parseISODate(first.date);
        let startDate;

        switch (period) {
          case "1w":
            startDate = new Date(endDate);
            startDate.setDate(startDate.getDate() - 7);
            break;
          case "1m":
            startDate = new Date(endDate);
            startDate.setMonth(startDate.getMonth() - 1);
            break;
          case "3m":
            startDate = new Date(endDate);
            startDate.setMonth(startDate.getMonth() - 3);
            break;
          case "6m":
            startDate = new Date(endDate);
            startDate.setMonth(startDate.getMonth() - 6);
            break;
          case "1y":
            startDate = new Date(endDate);
            startDate.setFullYear(startDate.getFullYear() - 1);
            break;
          case "ytd":
            startDate = new Date(endDate.getFullYear(), 0, 1);
            break;
          case "all":
          default:
            startDate = minDate;
        }

        if (startDate < minDate) startDate = minDate;

        document.getElementById("period-from").value = toISODate(startDate);
        document.getElementById("period-to").value = last.date;
        updatePeriodStats();
      }

      function updatePeriodStats() {
        const fromStr = document.getElementById("period-from").value;
        const toStr = document.getElementById("period-to").value;
        const statsEl = document.getElementById("period-stats");
        const hintEl = document.getElementById("period-hint");

        if (!fromStr || !toStr) {
          statsEl.innerHTML = "";
          hintEl.textContent = "請選擇起始與結束日期";
          return;
        }
        if (fromStr > toStr) {
          statsEl.innerHTML = "";
          hintEl.textContent = "起始日期不可晚於結束日期";
          return;
        }

        const bounds = findPeriodBounds(historyData, fromStr, toStr);
        if (!bounds) {
          statsEl.innerHTML = "";
          hintEl.textContent = "此區間內查無交易資料，請調整日期";
          return;
        }

        const { startEntry, endEntry } = bounds;
        const diff = endEntry.close - startEntry.close;
        const ratio = startEntry.close ? (diff / startEntry.close) * 100 : null;
        const diffClass = diff > 0 ? "price-up" : diff < 0 ? "price-down" : "";
        const diffPrefix = diff > 0 ? "+" : "";
        const ratioText =
          ratio === null
            ? "n/a"
            : `${ratio >= 0 ? "+" : ""}${ratio.toFixed(2)}%`;

        const within = historyData.filter(
          (p) => p.date >= startEntry.date && p.date <= endEntry.date,
        );
        const highs = within.map((p) => p.high).filter((v) => v != null);
        const lows = within.map((p) => p.low).filter((v) => v != null);
        const periodHigh = highs.length ? Math.max(...highs) : null;
        const periodLow = lows.length ? Math.min(...lows) : null;

        // Same-period index return, for relative-strength context.
        const indexBounds = findPeriodBounds(indexHistory, fromStr, toStr);
        let indexRatioText = "n/a";
        let indexDiffClass = "";
        let relativeText = "n/a";
        let relativeClass = "";
        if (indexBounds && indexBounds.startEntry.close) {
          const indexDiff =
            indexBounds.endEntry.close - indexBounds.startEntry.close;
          const indexRatio = (indexDiff / indexBounds.startEntry.close) * 100;
          indexDiffClass =
            indexDiff > 0 ? "price-up" : indexDiff < 0 ? "price-down" : "";
          indexRatioText = `${indexRatio >= 0 ? "+" : ""}${indexRatio.toFixed(2)}%`;
          if (ratio !== null) {
            const relative = ratio - indexRatio;
            relativeClass =
              relative > 0 ? "price-up" : relative < 0 ? "price-down" : "";
            relativeText = `${relative >= 0 ? "+" : ""}${relative.toFixed(2)}%`;
          }
        }

        statsEl.innerHTML = `
          <div class="stat-item">
            <span class="stat-label">起始 ${startEntry.date}</span>
            <span class="stat-value" style="font-size: 1rem;">${startEntry.close ?? "n/a"}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">結束 ${endEntry.date}</span>
            <span class="stat-value" style="font-size: 1rem;">${endEntry.close ?? "n/a"}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">漲跌</span>
            <span class="stat-value ${diffClass}">${diffPrefix}${diff.toFixed(2)}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">漲跌幅</span>
            <span class="stat-value ${diffClass}">${ratioText}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">${indexLabel}同期漲跌幅</span>
            <span class="stat-value ${indexDiffClass}">${indexRatioText}</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">相對大盤</span>
            <span class="stat-value ${relativeClass}">${relativeText}</span>
          </div>
        `;

        hintEl.textContent =
          `區間內共 ${within.length} 個交易日` +
          (periodHigh != null ? ` · 期間最高 ${periodHigh}` : "") +
          (periodLow != null ? ` · 期間最低 ${periodLow}` : "");
      }

      function initWatchlistPicker(id) {
        const btn = document.getElementById("btn-add-watchlist");
        const picker = document.getElementById("watchlist-picker");
        if (!btn || !picker) return;

        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const isOpen = picker.classList.contains("open");
          picker.classList.remove("open");
          if (!isOpen) openWatchlistPicker(id, picker);
        });

        document.addEventListener("click", () => {
          picker.classList.remove("open");
        });
        picker.addEventListener("click", (e) => e.stopPropagation());
      }

      const WATCHLIST_PICKER_VISIBLE_ROWS = 10;

      async function openWatchlistPicker(id, picker) {
        picker.classList.add("open");
        picker.style.maxHeight = ""; // reset any cap from a previous open
        picker.innerHTML = `<div class="watchlist-picker-empty">載入中…</div>`;

        try {
          if (!watchlistsCache) {
            const res = await fetch(
              `${API_BASE}/api/mktobs/watchlist?sort_by=order&order=asc`,
            );
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            watchlistsCache = await res.json();
          }
        } catch (e) {
          console.error("Error loading watchlists:", e);
          picker.innerHTML = `<div class="watchlist-picker-empty">載入自選股清單失敗，請稍後再試</div>`;
          return;
        }

        if (!watchlistsCache || watchlistsCache.length === 0) {
          picker.innerHTML = `<div class="watchlist-picker-empty">尚無自選股清單<br /><a href="watchlist.html">前往建立 →</a></div>`;
          return;
        }

        picker.innerHTML = watchlistsCache
          .map((wl) => {
            const already = (wl.items || []).some((it) => it.stock_id === id);
            return `<button class="watchlist-picker-item" data-list="${wl.name}" ${already ? "disabled" : ""}>${wl.name}${already ? " ✓ 已在清單中" : ""}</button>`;
          })
          .join("");

        const itemEls = picker.querySelectorAll(".watchlist-picker-item");
        itemEls.forEach((itemBtn) => {
          itemBtn.addEventListener("click", () =>
            addToWatchlist(id, itemBtn.dataset.list, itemBtn),
          );
        });

        // Show exactly ~10 rows and let the rest scroll inside the picker
        // instead of pushing the whole page's layout around.
        if (itemEls.length > WATCHLIST_PICKER_VISIBLE_ROWS) {
          const itemHeight = itemEls[0].getBoundingClientRect().height;
          const pickerStyle = getComputedStyle(picker);
          const gap = parseFloat(pickerStyle.rowGap) || 0;
          const paddingV =
            parseFloat(pickerStyle.paddingTop) +
            parseFloat(pickerStyle.paddingBottom);
          const rows = WATCHLIST_PICKER_VISIBLE_ROWS;
          picker.style.maxHeight = `${itemHeight * rows + gap * (rows - 1) + paddingV}px`;
        }
      }

      async function addToWatchlist(id, listName, itemBtn) {
        itemBtn.disabled = true;
        itemBtn.textContent = "加入中…";
        try {
          const res = await fetch(
            `${API_BASE}/api/mktobs/watchlist/${encodeURIComponent(listName)}/items`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ stock_id: id, note: "", is_top: false }),
            },
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          itemBtn.textContent = `${listName} ✓ 已加入`;
          watchlistsCache = null; // stale — refetch next time the picker opens
        } catch (e) {
          console.error("Error adding to watchlist:", e);
          itemBtn.textContent = "加入失敗，請重試";
          itemBtn.disabled = false;
        }
      }

      function computeMA(data, period) {
        const result = [];
        let windowSum = 0;
        for (let i = 0; i < data.length; i++) {
          windowSum += data[i].close ?? 0;
          if (i >= period) windowSum -= data[i - period].close ?? 0;
          if (i >= period - 1) {
            result.push({ time: data[i].date, value: windowSum / period });
          }
        }
        return result;
      }

      function renderPriceChart(data) {
        const container = document.getElementById("priceChart");

        if (chartResizeObserver) {
          chartResizeObserver.disconnect();
          chartResizeObserver = null;
        }
        if (chart) {
          chart.remove();
          chart = null;
        }

        // LightweightCharts draws to <canvas>, which can't resolve CSS
        // custom properties — pull already-resolved values instead.
        const c = ChartTheme.colors();
        const upColor = c.up;
        const downColor = c.down;
        const textColor = c.tick;
        const gridColor = c.gridH;

        chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          layout: {
            background: { type: "solid", color: "transparent" },
            textColor: textColor,
          },
          grid: {
            vertLines: { visible: false },
            horzLines: { color: gridColor },
          },
          rightPriceScale: {
            borderVisible: false,
          },
          timeScale: {
            borderVisible: false,
            timeVisible: false,
            rightOffset: 2,
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
          },
        });

        candleSeries = chart.addCandlestickSeries({
          upColor: upColor,
          downColor: downColor,
          borderVisible: false,
          wickUpColor: upColor,
          wickDownColor: downColor,
          priceScaleId: "right",
        });
        candleSeries.priceScale().applyOptions({
          scaleMargins: { top: 0.05, bottom: 0.25 },
        });

        volumeSeries = chart.addHistogramSeries({
          priceFormat: { type: "volume" },
          priceScaleId: "",
        });
        volumeSeries.priceScale().applyOptions({
          scaleMargins: { top: 0.8, bottom: 0 },
        });

        candleSeries.setData(
          data.map((d) => ({
            time: d.date,
            open: d.open,
            high: d.high,
            low: d.low,
            close: d.close,
          })),
        );

        volumeSeries.setData(
          data.map((d) => ({
            time: d.date,
            value: d.volume ?? 0,
            color: d.close >= d.open ? upColor : downColor,
          })),
        );

        // MA lines use the three series tokens: all distinct from each other
        // and from the up/down candle colours.
        const maColors = { ma5: c.seriesA, ma20: c.seriesB, ma60: c.seriesC };
        [
          ["ma5", 5],
          ["ma20", 20],
          ["ma60", 60],
        ].forEach(([key, period]) => {
          if (data.length >= period) {
            const series = chart.addLineSeries({
              color: maColors[key],
              lineWidth: 1,
              priceLineVisible: false,
              lastValueVisible: false,
              crosshairMarkerVisible: false,
            });
            series.setData(computeMA(data, period));
          }
          const legendEl = document.getElementById(`${key}-legend`);
          if (legendEl) legendEl.style.color = maColors[key];
        });

        // OHLC readout overlay, shown while the crosshair is over a candle.
        container.querySelectorAll(".ohlc-readout").forEach((el) => el.remove());
        const readout = document.createElement("div");
        readout.className = "ohlc-readout";
        readout.style.cssText =
          "position:absolute;top:4px;left:8px;z-index:2;pointer-events:none;" +
          "font-size:0.75rem;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5;display:none";
        container.appendChild(readout);

        const rowByDate = new Map();
        data.forEach((d, i) => rowByDate.set(d.date, i));
        const fmt = (n) =>
          n == null
            ? "-"
            : n.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });

        chart.subscribeCrosshairMove((param) => {
          const i = param.time != null ? rowByDate.get(param.time) : undefined;
          if (i === undefined) {
            readout.style.display = "none";
            return;
          }
          const d = data[i];
          const prev = i > 0 ? data[i - 1].close : d.open;
          const diff = d.close - prev;
          const pct = prev ? (diff / prev) * 100 : 0;
          const color = diff > 0 ? upColor : diff < 0 ? downColor : textColor;
          const sign = diff > 0 ? "+" : "";
          readout.style.color = color;
          const vol =
            d.volume != null ? Math.ceil(d.volume / 1000).toLocaleString() : "-";
          const row = (items) =>
            `<div style="display:flex;gap:0.9rem">${items
              .map((t) => `<span>${t}</span>`)
              .join("")}</div>`;
          readout.innerHTML =
            row([
              `開=${fmt(d.open)}`,
              `高=${fmt(d.high)}`,
              `低=${fmt(d.low)}`,
              `收=${fmt(d.close)}`,
            ]) +
            row([
              `漲跌=${sign}${fmt(diff)}(${sign}${pct.toFixed(2)}%)`,
              `成交量=${vol}張`,
            ]);
          readout.style.display = "block";
        });

        chart.timeScale().fitContent();

        chartResizeObserver = new ResizeObserver((entries) => {
          if (!entries.length || !chart) return;
          const { width, height } = entries[0].contentRect;
          chart.applyOptions({ width, height });
        });
        chartResizeObserver.observe(container);
      }

      init();
    </script>
  </body>
</html>
