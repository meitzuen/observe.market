<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Observer | 市場觀測站</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      [v-cloak] {
        display: none;
      }
    </style>
  </head>
  <body data-market="twse">
    <header id="site-header"></header>

    <div class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">上市大盤</h1>
          <p class="page-subtitle">TWSE 加權指數、個股行情、跳空漲跌與處置股</p>
        </div>
        <div class="page-actions">
          <select id="date-picker" class="date-select" aria-label="選擇日期"></select>
          <span id="last-update" class="last-update"></span>
        </div>
      </div>
      <div class="grid">
        <div class="main-content">
          <div class="card" style="margin-bottom: 1.5rem">
            <div class="card-title">
              <span>大盤指數趨勢</span>
              <div
                id="index-date"
                style="
                  font-size: 0.875rem;
                  font-weight: normal;
                  color: var(--text-muted);
                "
              ></div>
            </div>
            <div style="height: 300px; position: relative">
              <canvas id="indexChart"></canvas>
            </div>
          </div>

          <div class="card">
            <div class="card-title card-title-center">
              <span
                >個股行情
                <span id="stock-count" class="badge badge-primary"></span
              ></span>
            </div>
            <div class="search-box">
              <input
                type="text"
                id="stock-search"
                placeholder="搜尋代號或名稱..."
              />
            </div>
            <div class="filter-controls toolbar">
              <div class="filter-pill">
                <span>價格:</span
                >
                <input
                  type="number"
                  id="price-min"
                  placeholder="最小"
                />
                <span>-</span>
                <input
                  type="number"
                  id="price-max"
                  placeholder="最大"
                />
              </div>
              <div class="filter-pill">
                <span>成交量 >
                </span>
                <input
                  type="number"
                  id="volume-min"
                  placeholder="10,000"
                />
                <span>張</span>
              </div>
              <div class="filter-pill">
                <span>漲跌幅:</span
                >
                <input
                  type="number"
                  id="ratio-min"
                  placeholder="最小%"
                />
                <span>-</span>
                <input
                  type="number"
                  id="ratio-max"
                  placeholder="最大%"
                />
              </div>
              <div class="filter-pill">
                <span>每頁筆數:</span
                >
                <select
                  id="rows-per-page"
                >
                  <option value="10" selected>10</option>
                  <option value="15">15</option>
                  <option value="20">20</option>
                  <option value="25">25</option>
                  <option value="30">30</option>
                </select>
              </div>
              <button
                id="clear-filters"
                class="btn btn-secondary"
              >
                清除條件
              </button>
            </div>
            <div class="table-container">
              <table id="stock-table">
                <thead>
                  <tr>
                    <th style="cursor: pointer" onclick="setSort('id')">
                      代號 <span id="sort-id"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('name')">
                      名稱 <span id="sort-name"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('close')">
                      成交價 <span id="sort-close"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('diff')">
                      漲跌 <span id="sort-diff"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('ratio')">
                      漲幅 <span id="sort-ratio"></span>
                    </th>
                    <th style="cursor: pointer" onclick="setSort('volume')">
                      成交量(張) <span id="sort-volume"></span>
                    </th>
                  </tr>
                </thead>
                <tbody id="stock-list">
                  <!-- Data will be loaded here -->
                </tbody>
              </table>
            </div>
            <div id="result-state"></div>
            <div id="stock-loader" class="loader">載入中...</div>
            <div id="pagination-controls" class="pagination">
              <button id="prev-page" class="btn btn-secondary">上一頁</button>
              <span id="page-info">第 1 / 1 頁</span>
              <button id="next-page" class="btn btn-secondary">下一頁</button>
            </div>
          </div>
        </div>

        <div class="sidebar">
          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">市場摘要</div>
              <div id="market-summary" class="stats">
                <div
                  class="stat-item"
                  style="border-left: 4px solid var(--text)"
                >
                  <span class="stat-label">大盤指數</span>
                  <span id="summary-index" class="stat-value">--</span>
                  <span id="summary-changes" class="stat-change">--</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交金額</span>
                  <span id="summary-turnover" class="stat-value">--</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交股數</span>
                  <span id="summary-volume" class="stat-value">--</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">成交比數</span>
                  <span id="summary-transactions" class="stat-value">--</span>
                </div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">
                <div style="display: flex; align-items: center; gap: 0.5rem">
                  <select
                    id="gap-type-switcher"
                    class="date-select"
                    style="
                      font-size: inherit;
                      font-weight: inherit;
                      letter-spacing: inherit;
                      text-transform: inherit;
                      border: none;
                      padding: 0;
                      background: transparent;
                      cursor: pointer;
                      color: inherit;
                      font-family: inherit;
                    "
                  >
                    <option value="gap_jump">跳空上漲</option>
                    <option value="gap_drop">跳空下跌</option>
                  </select>
                  <span id="gap-count" class="badge badge-accent"></span>
                </div>
              </div>
              <div
                style="
                  margin-bottom: 0.75rem;
                  display: flex;
                  justify-content: flex-end;
                "
              >
                <select
                  id="gap-sort"
                  class="date-select"
                  style="font-size: 0.75rem; padding: 0.25rem 0.5rem"
                >
                  <option value="diff-desc">漲點 ↓</option>
                  <option value="diff-asc">漲點 ↑</option>
                  <option value="ratio-desc">漲幅 ↓</option>
                  <option value="ratio-asc">漲幅 ↑</option>
                </select>
              </div>
              <div
                id="gap-list"
                style="max-height: 350px; overflow-y: auto; font-size: 0.875rem"
              >
                <div class="loader" style="height: 100px">載入中...</div>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="card">
              <div class="card-title card-title-center">
                <span>處置股票</span>
                <span id="punish-count" class="badge badge-danger"></span>
              </div>
              <div
                id="punish-list"
                style="max-height: 350px; overflow-y: auto; font-size: 0.875rem"
              >
                <div class="loader" style="height: 100px">載入中...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/chart-theme.js"></script>
    <script src="assets/shell.js"></script>
    <script src="assets/market-page.js"></script>
  </body>
</html>
