<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>當沖計算機 | Market Observer</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <style>
      .calc-grid {
        align-items: start;
      }

      @media (min-width: 1024px) {
        .calc-grid {
          grid-template-columns: minmax(320px, 1fr) minmax(0, 2fr);
        }
      }

      .field-block {
        margin-bottom: var(--s4);
      }

      .field-block:last-child {
        margin-bottom: 0;
      }

      .field-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: var(--s1);
      }

      .plain-input {
        width: 100%;
      }

      /* Tab groups (交易類型 / 交易方向) */
      .tab-group {
        display: flex;
        gap: var(--s2);
      }

      .tab-btn {
        flex: 1;
        padding: var(--s2);
        border-radius: var(--radius);
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--text-muted);
        font-weight: 600;
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
      }

      .tab-btn:hover {
        background: var(--hover);
        color: var(--text);
      }

      .tab-btn.type-active {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }

      .tab-btn.dir-long.dir-active {
        background: var(--up);
        border-color: var(--up);
        color: #fff;
      }

      .tab-btn.dir-short.dir-active {
        background: var(--down);
        border-color: var(--down);
        color: #fff;
      }

      /* Price / qty inputs with suffix */
      .input-with-suffix {
        display: flex;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--surface);
      }

      .input-with-suffix:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }

      .input-with-suffix input {
        flex: 1;
        min-width: 0;
        border: none;
        border-radius: 0;
        outline: none;
        background: transparent;
      }

      .input-with-suffix .suffix {
        display: flex;
        align-items: center;
        padding: 0 var(--s3);
        font-size: 13px;
        color: var(--text-muted);
        background: var(--hover);
        border-left: 1px solid var(--border);
        white-space: nowrap;
      }

      .fee-row {
        display: flex;
        gap: var(--s3);
      }

      .fee-row .field-block {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
      }

      /* Unit toggle switch */
      .unit-toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s3);
        padding: var(--s2) var(--s3);
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .unit-toggle-label {
        font-weight: 600;
      }

      .unit-toggle-hint {
        font-size: 12px;
        color: var(--text-muted);
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .switch-slider {
        position: absolute;
        inset: 0;
        background: var(--border-strong);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s;
      }

      .switch-slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        background: var(--surface);
        border-radius: 50%;
        transition: transform 0.15s;
      }

      .switch input:checked + .switch-slider {
        background: var(--accent);
      }

      .switch input:checked + .switch-slider::before {
        transform: translateX(18px);
      }

      .switch input:focus-visible + .switch-slider {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .stock-lookup-row {
        display: flex;
        gap: var(--s2);
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .stock-lookup-row .field-block {
        flex: 1;
        min-width: 120px;
        margin-bottom: 0;
      }

      #dt-autofill-btn {
        white-space: nowrap;
      }

      .stock-name-hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: var(--s1);
        min-height: 1em;
      }

      #dt-calc-btn {
        width: 100%;
        justify-content: center;
        margin-top: var(--s1);
      }

      .error-msg {
        color: var(--up);
        font-size: 13px;
        margin-top: var(--s3);
      }

      .hint-text {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: var(--s4);
        line-height: 1.5;
      }

      /* Results table */
      table.results-table th,
      table.results-table td {
        text-align: center;
      }

      .price-neutral {
        color: var(--text-muted);
      }

      table.results-table tbody tr.row-current td {
        background: var(--accent-soft);
      }

      .load-more-row {
        display: flex;
        justify-content: center;
        padding: var(--s3);
      }

      .results-empty {
        text-align: center;
        padding: var(--s6) var(--s4);
        color: var(--text-muted);
      }

      #stock-info-status:not(:empty) {
        margin-bottom: var(--s4);
      }

      #stock-info-status .banner {
        border-radius: var(--radius);
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <header id="site-header"></header>

    <main class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">當沖計算機</h1>
          <p class="page-subtitle">當沖損益與成本試算</p>
        </div>
      </div>

      <div id="stock-info-status"></div>

      <div class="grid calc-grid">
        <div class="card">
          <h2 class="card-title">計算機</h2>

          <div class="field-block">
            <label class="field-label">股票代號（選填）</label>
            <div class="stock-lookup-row">
              <div class="field-block">
                <input
                  type="text"
                  id="dt-stock-id"
                  placeholder="ex: 2330"
                  list="stock-datalist"
                  autocomplete="off"
                  class="plain-input"
                />
                <datalist id="stock-datalist"></datalist>
              </div>
              <button class="btn btn-secondary" id="dt-autofill-btn" type="button">
                帶入最新收盤價
              </button>
            </div>
            <div class="stock-name-hint" id="dt-stock-name">&nbsp;</div>
          </div>

          <div class="field-block">
            <label class="field-label">交易類型</label>
            <div class="tab-group">
              <button class="tab-btn" data-type="stock">個股</button>
              <button class="tab-btn" data-type="daytrade">個股當沖</button>
              <button class="tab-btn" data-type="etf">ETF</button>
            </div>
          </div>

          <div class="field-block">
            <label class="field-label" for="dt-price">開倉價格</label>
            <div class="input-with-suffix">
              <input
                type="number"
                id="dt-price"
                placeholder="請輸入開倉價格"
                min="0"
                step="0.01"
              />
              <span class="suffix">元</span>
            </div>
          </div>

          <div class="field-block">
            <label class="field-label" for="dt-qty">交易數量</label>
            <div class="input-with-suffix">
              <input
                type="number"
                id="dt-qty"
                placeholder="請輸入交易數量"
                min="0"
                step="0.1"
              />
              <span class="suffix" id="dt-qty-suffix">張</span>
            </div>
          </div>

          <div class="field-block">
            <div class="unit-toggle-row">
              <div>
                <div class="unit-toggle-label">以張為單位</div>
                <div class="unit-toggle-hint">提示：1 張 = 1000 股</div>
              </div>
              <label class="switch">
                <input type="checkbox" id="dt-unit-toggle" checked />
                <span class="switch-slider"></span>
              </label>
            </div>
          </div>

          <div class="field-block fee-row">
            <div class="field-block">
              <label class="field-label" for="dt-fee-discount"
                >手續費折數（折）</label
              >
              <div class="input-with-suffix">
                <input
                  type="number"
                  id="dt-fee-discount"
                  placeholder="例如 2.8"
                  min="0"
                  max="10"
                  step="0.1"
                />
              </div>
            </div>
            <div class="field-block">
              <label class="field-label" for="dt-min-fee">最低手續費</label>
              <div class="input-with-suffix">
                <input
                  type="number"
                  id="dt-min-fee"
                  placeholder="20"
                  min="0"
                  step="1"
                />
                <span class="suffix">元</span>
              </div>
            </div>
          </div>

          <div class="field-block">
            <label class="field-label">交易方向</label>
            <div class="tab-group">
              <button class="tab-btn dir-long" data-dir="long">
                做多（賺漲）
              </button>
              <button class="tab-btn dir-short" data-dir="short">
                做空（賺跌）
              </button>
            </div>
            <div class="stock-name-hint">
              開倉價格固定視為買入價格，梯次價格為賣出價格；選「做空」代表預期價格下跌，僅反轉損益方向。
            </div>
          </div>

          <button id="dt-calc-btn" class="btn btn-primary" type="button">計算</button>

          <div id="form-error" class="error-msg" style="display: none"></div>

          <div class="hint-text">
            手續費費率 0.1425%（可依券商折扣調整），證交稅一般現股 0.3%、現股當沖減半
            0.15%、ETF 0.1%。試算結果僅供參考，實際費用依券商及交易所公告為準。
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">計算結果</h2>
          <div
            class="load-more-row"
            id="load-more-row-top"
            style="display: none"
          >
            <button class="btn btn-secondary" id="load-more-top-btn">
              ＋ 顯示更多
            </button>
          </div>
          <div class="table-container">
            <table class="results-table">
              <thead>
                <tr>
                  <th>買入價格</th>
                  <th>賣出價格</th>
                  <th>證交稅</th>
                  <th>總手續費</th>
                  <th>獲利</th>
                  <th>報酬率</th>
                </tr>
              </thead>
              <tbody id="results-tbody">
                <tr>
                  <td colspan="6" class="results-empty">
                    請輸入開倉價格與交易數量後按「計算」
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div
            class="load-more-row"
            id="load-more-row-bottom"
            style="display: none"
          >
            <button class="btn btn-secondary" id="load-more-bottom-btn">
              ＋ 顯示更多
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/data.js"></script>
    <script src="assets/shell.js"></script>
    <script>
      const STATE_KEY = "day_trade_calc_state_v2";
      const DEFAULT_FEE_RATE = 0.001425; // 0.1425%
      const TAX_RATES = { stock: 0.003, daytrade: 0.0015, etf: 0.001 };
      const MAX_PCT = 10; // stop the ladder once |報酬率| would exceed this
      const MAX_STEPS = 500; // safety cap so a tiny tick size can't loop forever
      const INITIAL_SIDE = 5; // rows shown above/below the entry row by default
      const PAGE_SIZE = 5; // rows revealed per "顯示更多" click

      let stockInfo = {};
      const historyCache = {};

      // UI state
      let txType = "daytrade"; // stock | daytrade | etf
      let direction = "long"; // long | short
      let allRows = []; // sorted by sell price desc, all generated rows
      let entryIndex = -1; // index of the entry-price row inside allRows
      let topShown = 0; // rows revealed above the entry row (higher price)
      let bottomShown = 0; // rows revealed below the entry row (lower price)

      // ── Formatting ──────────────────────────────────────────────────────────
      function fmtMoney(v) {
        if (v == null || Number.isNaN(v)) return "—";
        return v.toLocaleString("zh-TW", { maximumFractionDigits: 0 });
      }

      function fmtPrice(v) {
        if (v == null || Number.isNaN(v)) return "—";
        return v.toLocaleString("zh-TW", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      }

      function fmtPct(v) {
        if (v == null || Number.isNaN(v)) return "—";
        const sign = v > 0 ? "+" : "";
        return `${sign}${v.toFixed(2)}%`;
      }

      function plClass(v) {
        if (v == null || Number.isNaN(v) || v === 0) return "price-neutral";
        return v > 0 ? "price-up" : "price-down";
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function round2(v) {
        return Math.round(v * 100) / 100;
      }

      // ── Taiwan tick-size ladder ────────────────────────────────────────────
      // Official TWSE tick-size brackets: [0,10)=0.01 [10,50)=0.05 [50,100)=0.1
      // [100,500)=0.5 [500,1000)=1 [1000,∞)=5
      function tickSize(price) {
        if (price < 10) return 0.01;
        if (price < 50) return 0.05;
        if (price < 100) return 0.1;
        if (price < 500) return 0.5;
        if (price < 1000) return 1;
        return 5;
      }

      function stepUp(price) {
        return round2(price + tickSize(price));
      }

      function stepDown(price) {
        // The bracket just below the current price decides the down-tick,
        // so boundary prices (10 / 50 / 100 / 500 / 1000) cross correctly.
        return round2(price - tickSize(price - 1e-6));
      }

      // ── Fee / tax / profit ──────────────────────────────────────────────────
      function calcFee(amount, discount, minFee) {
        const raw = amount * DEFAULT_FEE_RATE * (discount / 10);
        return Math.max(Math.floor(raw), minFee);
      }

      function calcTax(amount, rate) {
        return Math.floor(amount * rate);
      }

      function computeRow(entryPrice, ladderPrice, shares, discount, minFee, taxRate) {
        // 開倉價格一律視為買入價格，梯次價格一律視為賣出價格；
        // 「做空（賣出）」只反轉損益方向（跌價才獲利），不改變買入/賣出欄位的對應。
        const buyPrice = entryPrice;
        const sellPrice = ladderPrice;
        const buyAmount = buyPrice * shares;
        const sellAmount = sellPrice * shares;
        const buyFee = calcFee(buyAmount, discount, minFee);
        const sellFee = calcFee(sellAmount, discount, minFee);
        const totalFee = buyFee + sellFee;
        const tax = calcTax(sellAmount, taxRate);
        const rawDiff =
          direction === "long"
            ? sellAmount - buyAmount
            : buyAmount - sellAmount;
        const profit = rawDiff - totalFee - tax;
        const entryAmount = entryPrice * shares;
        const pct = entryAmount > 0 ? (profit / entryAmount) * 100 : null;
        const isCurrent = ladderPrice === entryPrice;
        return { buyPrice, sellPrice, tax, totalFee, profit, pct, isCurrent };
      }

      // Walk the tick ladder up and down from the entry price, stopping once the
      // resulting 報酬率 would exceed ±MAX_PCT. Always sorted by sell price desc
      // (highest price first) so the entry row lands in the middle, not buried.
      function buildRows(entryPrice, shares, discount, minFee, taxRate) {
        const rows = [computeRow(entryPrice, entryPrice, shares, discount, minFee, taxRate)];

        let p = entryPrice;
        for (let i = 0; i < MAX_STEPS; i++) {
          p = stepUp(p);
          const row = computeRow(entryPrice, p, shares, discount, minFee, taxRate);
          if (row.pct != null && Math.abs(row.pct) > MAX_PCT) break;
          rows.push(row);
        }

        p = entryPrice;
        for (let i = 0; i < MAX_STEPS; i++) {
          p = stepDown(p);
          if (p <= 0) break;
          const row = computeRow(entryPrice, p, shares, discount, minFee, taxRate);
          if (row.pct != null && Math.abs(row.pct) > MAX_PCT) break;
          rows.push(row);
        }

        rows.sort((a, b) => b.sellPrice - a.sellPrice);
        return rows;
      }

      // ── Form helpers ────────────────────────────────────────────────────────
      function showFormError(msg) {
        const el = document.getElementById("form-error");
        el.textContent = msg;
        el.style.display = "block";
      }

      function clearFormError() {
        document.getElementById("form-error").style.display = "none";
      }

      function setType(type) {
        txType = type;
        document.querySelectorAll(".tab-btn[data-type]").forEach((btn) => {
          btn.classList.toggle("type-active", btn.dataset.type === type);
        });
      }

      function setDirection(dir) {
        direction = dir;
        document.querySelectorAll(".tab-btn[data-dir]").forEach((btn) => {
          btn.classList.toggle("dir-active", btn.dataset.dir === dir);
        });
      }

      function isLotUnit() {
        return document.getElementById("dt-unit-toggle").checked;
      }

      function updateQtySuffix() {
        document.getElementById("dt-qty-suffix").textContent = isLotUnit()
          ? "張"
          : "股";
      }

      // ── State persistence ───────────────────────────────────────────────────
      function loadState() {
        try {
          const raw = localStorage.getItem(STATE_KEY);
          return raw ? JSON.parse(raw) : {};
        } catch {
          return {};
        }
      }

      function saveState() {
        const state = {
          stockId: document.getElementById("dt-stock-id").value,
          txType,
          direction,
          isLot: isLotUnit(),
          price: document.getElementById("dt-price").value,
          qty: document.getElementById("dt-qty").value,
          feeDiscount: document.getElementById("dt-fee-discount").value,
          minFee: document.getElementById("dt-min-fee").value,
        };
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
      }

      // ── Stock lookup (optional helper) ─────────────────────────────────────
      async function loadStockInfo() {
        try {
          const res = await fetch(UIData.dataUrl("stock_info.json"));
          stockInfo = await res.json();
        } catch (e) {
          console.error("無法載入 stock_info.json：", e);
          stockInfo = {};
          document.getElementById("stock-info-status").innerHTML =
            '<div class="banner banner-warn" role="status">股票清單載入失敗，代號查詢暫時無法使用</div>';
        }
        const datalist = document.getElementById("stock-datalist");
        datalist.innerHTML = Object.entries(stockInfo)
          .map(
            ([id, info]) =>
              `<option value="${id}">${escHtml(info.name || "")}</option>`,
          )
          .join("");
      }

      async function getHistory(stockId) {
        if (historyCache[stockId] !== undefined) return historyCache[stockId];
        const info = stockInfo[stockId];
        const market = info?.type === "tpex" ? "tpex" : "twse";
        try {
          const res = await fetch(
            UIData.dataUrl(`${market}/stock_history/${stockId}.json`),
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          historyCache[stockId] = data;
          return data;
        } catch (e) {
          historyCache[stockId] = null;
          return null;
        }
      }

      function updateStockNameHint() {
        const id = document.getElementById("dt-stock-id").value.trim();
        const info = stockInfo[id];
        const hint = document.getElementById("dt-stock-name");
        hint.textContent = info
          ? `${info.name}（${info.type === "tpex" ? "上櫃" : "上市"}）`
          : " ";
      }

      async function autofillLatestClose() {
        clearFormError();
        const id = document.getElementById("dt-stock-id").value.trim();
        if (!id || !stockInfo[id]) {
          showFormError("請先輸入有效的股票代號");
          return;
        }
        const history = await getHistory(id);
        if (!history || history.length === 0) {
          showFormError("查無該股票的收盤價資料，請手動輸入");
          return;
        }
        const latest = history[history.length - 1];
        document.getElementById("dt-price").value = latest.close;
        calculate();
      }

      // ── Calculation ─────────────────────────────────────────────────────────
      function calculate() {
        saveState();
        clearFormError();

        const entryPrice = parseFloat(document.getElementById("dt-price").value);
        const qtyRaw = parseFloat(document.getElementById("dt-qty").value);
        const discountRaw = parseFloat(
          document.getElementById("dt-fee-discount").value,
        );
        const minFeeRaw = parseFloat(document.getElementById("dt-min-fee").value);

        const tbody = document.getElementById("results-tbody");

        if (!entryPrice || entryPrice <= 0 || !qtyRaw || qtyRaw <= 0) {
          allRows = [];
          entryIndex = -1;
          topShown = 0;
          bottomShown = 0;
          tbody.innerHTML =
            '<tr><td colspan="6" class="results-empty">請輸入開倉價格與交易數量後按「計算」</td></tr>';
          document.getElementById("load-more-row-top").style.display = "none";
          document.getElementById("load-more-row-bottom").style.display = "none";
          return;
        }

        const discount = discountRaw > 0 ? discountRaw : 10;
        const minFee =
          minFeeRaw >= 0 && !Number.isNaN(minFeeRaw) ? minFeeRaw : 20;
        const shares = isLotUnit() ? qtyRaw * 1000 : qtyRaw;
        const taxRate = TAX_RATES[txType];

        allRows = buildRows(entryPrice, shares, discount, minFee, taxRate);
        entryIndex = allRows.findIndex((r) => r.isCurrent);
        topShown = Math.min(INITIAL_SIDE, entryIndex);
        bottomShown = Math.min(INITIAL_SIDE, allRows.length - 1 - entryIndex);
        renderRows();
      }

      function renderRows() {
        const tbody = document.getElementById("results-tbody");
        if (entryIndex < 0) return;

        const startIdx = Math.max(0, entryIndex - topShown);
        const endIdx = Math.min(allRows.length - 1, entryIndex + bottomShown);
        const rows = allRows.slice(startIdx, endIdx + 1);

        tbody.innerHTML = rows
          .map(
            (r) => `<tr class="${r.isCurrent ? "row-current" : ""}">
              <td>${fmtPrice(r.buyPrice)}</td>
              <td>${fmtPrice(r.sellPrice)}</td>
              <td>${fmtMoney(r.tax)}</td>
              <td>${fmtMoney(r.totalFee)}</td>
              <td class="${plClass(r.profit)}">${r.profit > 0 ? "+" : ""}${fmtMoney(r.profit)}</td>
              <td class="${plClass(r.pct)}">${fmtPct(r.pct)}</td>
            </tr>`,
          )
          .join("");

        document.getElementById("load-more-row-top").style.display =
          startIdx > 0 ? "flex" : "none";
        document.getElementById("load-more-row-bottom").style.display =
          endIdx < allRows.length - 1 ? "flex" : "none";
      }

      // ── Wire up events ──────────────────────────────────────────────────────
      document.querySelectorAll(".tab-btn[data-type]").forEach((btn) => {
        btn.addEventListener("click", () => {
          setType(btn.dataset.type);
          calculate();
        });
      });
      document.querySelectorAll(".tab-btn[data-dir]").forEach((btn) => {
        btn.addEventListener("click", () => {
          setDirection(btn.dataset.dir);
          calculate();
        });
      });
      document.getElementById("dt-unit-toggle").addEventListener("change", () => {
        updateQtySuffix();
        calculate();
      });
      [
        "dt-price",
        "dt-qty",
        "dt-fee-discount",
        "dt-min-fee",
      ].forEach((id) => {
        document.getElementById(id).addEventListener("input", calculate);
      });
      document
        .getElementById("dt-stock-id")
        .addEventListener("input", updateStockNameHint);
      document
        .getElementById("dt-autofill-btn")
        .addEventListener("click", autofillLatestClose);
      document.getElementById("dt-calc-btn").addEventListener("click", calculate);
      document.getElementById("load-more-top-btn").addEventListener("click", () => {
        topShown = Math.min(entryIndex, topShown + PAGE_SIZE);
        renderRows();
      });
      document.getElementById("load-more-bottom-btn").addEventListener("click", () => {
        bottomShown = Math.min(
          allRows.length - 1 - entryIndex,
          bottomShown + PAGE_SIZE,
        );
        renderRows();
      });

      (async function init() {
        await loadStockInfo();

        const saved = loadState();
        document.getElementById("dt-stock-id").value = saved.stockId || "";
        setType(saved.txType || "daytrade");
        setDirection(saved.direction || "long");
        document.getElementById("dt-unit-toggle").checked =
          saved.isLot !== undefined ? saved.isLot : true;
        updateQtySuffix();
        document.getElementById("dt-price").value = saved.price || "100";
        document.getElementById("dt-qty").value = saved.qty || "1";
        document.getElementById("dt-fee-discount").value =
          saved.feeDiscount || "2.8";
        document.getElementById("dt-min-fee").value = saved.minFee || "20";

        updateStockNameHint();
        calculate();

        // Deep link from a stock detail page: day-trade-calculator.html?id=2330
        const linkId = new URLSearchParams(location.search).get("id");
        if (linkId && stockInfo[linkId]) {
          document.getElementById("dt-stock-id").value = linkId;
          updateStockNameHint();
        }
      })();
    </script>
  </body>
</html>
