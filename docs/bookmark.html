<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>常用連結 | Market Observer</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <style>
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      @media (max-width: 480px) {
        h1 span.title-text {
          display: none;
        }
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--hud-border-2);
      }

      .page-title {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
        color: var(--hud-text-1);
      }

      .page-eyebrow {
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--bm-accent);
        text-transform: uppercase;
        margin: 0 0 0.4rem;
      }

      .page-title-lg {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 2.2rem;
        font-weight: 800;
        margin: 0 0 0.6rem;
        color: var(--hud-text-1);
        letter-spacing: -0.01em;
      }

      .page-desc {
        font-size: 0.95rem;
        color: var(--hud-text-3);
        margin: 0;
        max-width: 46rem;
      }

      .btn-add {
        background: var(--bm-accent);
        color: var(--hud-text-1);
        white-space: nowrap;
      }

      .btn-add:hover {
        background: var(--bm-accent-dark);
      }

      .btn-primary {
        background: transparent;
        border: 1px solid var(--hud-border-1);
        color: var(--hud-text-1);
      }

      .btn-primary:hover {
        background: var(--hud-hover-bg);
      }

      .btn-danger {
        background: transparent;
        color: var(--hud-up);
        border: 1px solid var(--hud-up);
        padding: 0.25rem 0.6rem;
        font-size: 0.8rem;
      }

      .btn-danger:hover {
        background: transparent;
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: rgba(239, 68, 68, 0.9);
      }

      .btn-secondary:hover {
        background: var(--hud-bg);
        color: var(--hud-text-1);
      }

      .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.2rem 0.35rem;
        font-size: 0.85rem;
        line-height: 1;
        border-radius: 2px;
        transition:
          background 0.15s,
          opacity 0.15s;
      }

      .btn-icon:hover {
        background: var(--hud-bg);
      }

      /* Add / edit panel */
      .form-panel {
        display: none;
        background: var(--hud-card-bg);
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.25rem;
      }

      .form-panel h2 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 1rem;
        color: var(--hud-text-1);
      }

      .form-row {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        align-items: flex-end;
      }

      .form-row .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .form-row label {
        font-size: 0.8rem;
        color: var(--hud-text-3);
        font-weight: 500;
      }

      .form-row input {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        font-size: 0.9rem;
        font-family: inherit;
        color: var(--hud-text-1);
        background: var(--hud-bg);
        transition: border-color 0.15s;
        outline: none;
      }

      .form-row input:focus {
        border-color: var(--bm-accent);
      }

      .form-row input#bm-name {
        width: 160px;
      }

      .form-row input#bm-url {
        width: 260px;
      }

      .form-row input#bm-note {
        width: 160px;
      }

      .form-actions {
        display: flex;
        gap: 0.5rem;
      }

      .error-msg {
        color: var(--hud-up);
        font-size: 0.85rem;
        margin-top: 0.6rem;
      }

      /* Bookmark grid */
      .bookmark-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }

      .bookmark-card {
        position: relative;
        background: var(--bm-card-bg);
        border: none;
        border-radius: 2px;
        padding: 1rem;
        transition: background 0.15s;
      }

      .bookmark-card:hover {
        background: color-mix(in srgb, var(--bm-accent) 6%, var(--bm-card-bg));
      }

      .bookmark-card-main {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
      }

      .bookmark-icon {
        flex-shrink: 0;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: var(--hud-radius);
        border: 1px solid var(--hud-border-1);
        background: var(--hud-card-bg);
        color: var(--hud-text-1);
        font-weight: 700;
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .bookmark-card-body {
        min-width: 0;
        flex: 1;
        padding-right: 3.5rem;
      }

      .bookmark-name {
        display: block;
        font-weight: 700;
        font-size: 1rem;
        color: var(--hud-text-1);
        text-decoration: none;
        margin: 0 0 0.25rem;
        word-break: break-word;
      }

      .bookmark-name:hover {
        color: var(--bm-accent);
        text-decoration: underline;
      }

      .bookmark-url {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.78rem;
        color: var(--bm-accent);
        word-break: break-all;
      }

      .bookmark-url svg {
        flex-shrink: 0;
        opacity: 0.85;
      }

      .bookmark-note {
        font-size: 0.85rem;
        color: var(--hud-text-3);
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0.6rem 0 0;
      }

      .bookmark-actions {
        position: absolute;
        top: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.35rem;
      }

      .bookmark-actions .btn-icon {
        color: var(--bm-accent);
      }

      .bookmark-actions .btn-icon:hover {
        background: var(--bm-accent-tint);
      }

      .empty-state {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--hud-text-3);
      }

      .empty-state .icon {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      .loading {
        text-align: center;
        padding: 2rem;
        color: var(--hud-text-3);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          id="header-logo"
          src="assets/logo.png"
          alt="Logo"
          style="height: 40px; width: auto"
          onerror="
            this.style.display = 'none';
            document.getElementById('header-emoji').style.display = 'inline';
          "
        />
        <span id="header-emoji" style="display: none; font-size: 1.5rem"
          >📈</span
        >
        <h1><span class="title-text">Market Observer</span></h1>
        <nav class="nav-bar">
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">市場</button>
            <div class="nav-dropdown-menu">
              <a href="twse.html" class="nav-dropdown-item">上市</a>
              <a href="tpex.html" class="nav-dropdown-item">上櫃</a>
              <a href="index.html" class="nav-dropdown-item">全部</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">策略</button>
            <div class="nav-dropdown-menu">
              <a href="gap.html" class="nav-dropdown-item">跳空漲跌</a>
              <a href="punish.html" class="nav-dropdown-item">處置股票</a>
              <a href="wantgoo.html" class="nav-dropdown-item">基本面</a>
              <a href="volatility.html" class="nav-dropdown-item">區間波動率</a>
              <a href="vcp.html" class="nav-dropdown-item">VCP選股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">權證</button>
            <div class="nav-dropdown-menu">
              <a href="premium-warrant.html" class="nav-dropdown-item"
                >精選權證</a
              >
              <a href="warrant-filter.html" class="nav-dropdown-item"
                >權證篩選</a
              >
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">選股</button>
            <div class="nav-dropdown-menu">
              <a href="screener.html" class="nav-dropdown-item">股票篩選器</a>
              <a href="watchlist.html" class="nav-dropdown-item">精選類股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn active">個人</button>
            <div class="nav-dropdown-menu">
              <a href="bookmark.html" class="nav-dropdown-item active"
                >常用連結</a
              >
              <a href="portfolio.html" class="nav-dropdown-item">持股試算</a>
            </div>
          </div>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="切換深色模式">
          🌙
        </button>
      </div>
      <div class="header-right"></div>
    </header>

    <main class="container">
      <div class="page-header">
        <div>
          <p class="page-eyebrow">Bookmarks</p>
          <h2 class="page-title-lg">🔖 常用連結</h2>
          <p class="page-desc">
            收藏常看的股票頁面、看盤網址與研究筆記，全部集中在這裡。
          </p>
        </div>
        <button
          class="btn btn-add"
          onclick="toggleFormPanel()"
          id="toggle-form-btn"
          style="display: none"
        >
          ＋ 新增連結
        </button>
      </div>

      <!-- Add / edit panel -->
      <div class="form-panel" id="form-panel">
        <h2 id="form-panel-title">新增連結</h2>
        <div class="form-row">
          <div class="field">
            <label for="bm-name">名稱</label>
            <input type="text" id="bm-name" placeholder="ex: 股票分價量表" />
          </div>
          <div class="field">
            <label for="bm-url">網址</label>
            <input type="text" id="bm-url" placeholder="https://..." />
          </div>
          <div class="field">
            <label for="bm-note">備註</label>
            <input type="text" id="bm-note" placeholder="選填" />
          </div>
          <div class="field">
            <label
              style="visibility: hidden; font-size: 0.8rem; line-height: 1.2"
              >&nbsp;</label
            >
            <div class="form-actions">
              <button class="btn btn-add" id="form-submit-btn">新增</button>
              <button class="btn btn-secondary" onclick="closeFormPanel()">
                取消
              </button>
            </div>
          </div>
        </div>
        <div id="form-error" class="error-msg" style="display: none"></div>
      </div>

      <div class="loading" id="loading-msg">載入中…</div>

      <div class="bookmark-grid" id="bookmark-grid" style="display: none"></div>

      <div id="empty-state" class="empty-state" style="display: none">
        <div class="icon">🔖</div>
        <div>尚無常用連結</div>
        <div
          style="font-size: 0.85rem; margin-top: 0.4rem"
          id="empty-hint"
        ></div>
      </div>
    </main>

    <script src="assets/nerd-grid.js"></script>
    <script>
      // ── Mode ────────────────────────────────────────────────────────────────
      const isManage =
        new URLSearchParams(location.search).get("admin") === "True";
      NerdGrid.initThemeToggle();
      NerdGrid.initNavDropdowns();

      // ── Config ───────────────────────────────────────────────────────────────
      const API_BASE = "https://market.smallplum.xyz";

      // ── Icons ────────────────────────────────────────────────────────────────
      const ICON_PENCIL = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
      const ICON_TRASH = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
      const ICON_LINK = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;

      // ── State ────────────────────────────────────────────────────────────────
      let bookmarks = [];
      let editingId = null; // null = create mode, otherwise id being edited

      function bmId(bm) {
        return bm._id?.$oid ?? bm._id;
      }

      // ── API helpers ──────────────────────────────────────────────────────────
      async function apiGetBookmarks() {
        const res = await fetch(`${API_BASE}/api/mktobs/bookmark`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      async function apiCreateBookmark(name, url, note) {
        const res = await fetch(`${API_BASE}/api/mktobs/bookmark`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, url, note: note || "" }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        return res.json();
      }

      async function apiUpdateBookmark(id, data) {
        const res = await fetch(
          `${API_BASE}/api/mktobs/bookmark/${encodeURIComponent(id)}`,
          {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          },
        );
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        return res.json();
      }

      async function apiDeleteBookmark(id) {
        const res = await fetch(
          `${API_BASE}/api/mktobs/bookmark/${encodeURIComponent(id)}`,
          {
            method: "DELETE",
          },
        );
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
      }

      // ── Form panel ───────────────────────────────────────────────────────────
      let formPanelOpen = false;

      function toggleFormPanel() {
        if (formPanelOpen) {
          closeFormPanel();
        } else {
          openFormPanel();
        }
      }

      function openFormPanel(bm) {
        formPanelOpen = true;
        editingId = bm ? bmId(bm) : null;
        document.getElementById("form-panel").style.display = "block";
        document.getElementById("form-panel-title").textContent = bm
          ? "編輯連結"
          : "新增連結";
        document.getElementById("form-submit-btn").textContent = bm
          ? "儲存"
          : "新增";
        document.getElementById("bm-name").value = bm?.name || "";
        document.getElementById("bm-url").value = bm?.url || "";
        document.getElementById("bm-note").value = bm?.note || "";
        document.getElementById("form-error").style.display = "none";
        document.getElementById("bm-name").focus();
        document
          .getElementById("form-panel")
          .scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function closeFormPanel() {
        formPanelOpen = false;
        editingId = null;
        document.getElementById("form-panel").style.display = "none";
        document.getElementById("bm-name").value = "";
        document.getElementById("bm-url").value = "";
        document.getElementById("bm-note").value = "";
        document.getElementById("form-error").style.display = "none";
      }

      async function submitForm() {
        const nameInput = document.getElementById("bm-name");
        const urlInput = document.getElementById("bm-url");
        const noteInput = document.getElementById("bm-note");
        const errDiv = document.getElementById("form-error");
        errDiv.style.display = "none";

        const name = nameInput.value.trim();
        const url = urlInput.value.trim();
        const note = noteInput.value.trim();

        if (!name) {
          errDiv.textContent = "請輸入連結名稱";
          errDiv.style.display = "block";
          nameInput.focus();
          return;
        }
        if (!url) {
          errDiv.textContent = "請輸入網址";
          errDiv.style.display = "block";
          urlInput.focus();
          return;
        }

        try {
          if (editingId) {
            await apiUpdateBookmark(editingId, { name, url, note });
            const bm = bookmarks.find((b) => bmId(b) === editingId);
            if (bm) {
              bm.name = name;
              bm.url = url;
              bm.note = note;
            }
          } else {
            const created = await apiCreateBookmark(name, url, note);
            bookmarks.push(
              created && created._id
                ? created
                : { _id: created?._id, name, url, note },
            );
          }
          closeFormPanel();
          renderBookmarks();
        } catch (e) {
          errDiv.textContent = `${editingId ? "更新" : "新增"}失敗：${e.message}`;
          errDiv.style.display = "block";
        }
      }

      // ── Delete ───────────────────────────────────────────────────────────────
      async function deleteBookmark(id) {
        const bm = bookmarks.find((b) => bmId(b) === id);
        if (!bm) return;
        if (!confirm(`確定要刪除「${bm.name}」？此操作無法復原。`)) return;

        try {
          await apiDeleteBookmark(id);
          bookmarks = bookmarks.filter((b) => bmId(b) !== id);
          renderBookmarks();
        } catch (e) {
          alert(`刪除失敗：${e.message}`);
        }
      }

      // ── Render ───────────────────────────────────────────────────────────────
      function hostnameOf(url) {
        try {
          return new URL(url).hostname;
        } catch {
          return url;
        }
      }

      function renderBookmarks() {
        document.getElementById("loading-msg").style.display = "none";
        const grid = document.getElementById("bookmark-grid");
        const emptyState = document.getElementById("empty-state");

        if (bookmarks.length === 0) {
          grid.style.display = "none";
          emptyState.style.display = "block";
          document.getElementById("empty-hint").textContent = isManage
            ? "點擊右上方「＋ 新增連結」開始新增"
            : "";
          return;
        }

        emptyState.style.display = "none";
        grid.style.display = "grid";

        grid.innerHTML = bookmarks
          .map((bm) => {
            const id = bmId(bm);
            const note = bm.note
              ? `<div class="bookmark-note">${escHtml(bm.note)}</div>`
              : "";
            const actions = isManage
              ? `<div class="bookmark-actions">
                 <button class="btn-icon" title="編輯" onclick='openFormPanelById(${JSON.stringify(id)})'>${ICON_PENCIL}</button>
                 <button class="btn-icon" title="刪除" onclick='deleteBookmark(${JSON.stringify(id)})'>${ICON_TRASH}</button>
               </div>`
              : "";
            return `<div class="bookmark-card">
            ${actions}
            <div class="bookmark-card-main">
              <div class="bookmark-icon">${escHtml((bm.name || "?").trim().charAt(0) || "?")}</div>
              <div class="bookmark-card-body">
                <a class="bookmark-name" href="${escAttr(bm.url)}" target="_blank" rel="noopener noreferrer">${escHtml(bm.name)}</a>
                <div class="bookmark-url">${ICON_LINK}${escHtml(hostnameOf(bm.url))}</div>
              </div>
            </div>
            ${note}
          </div>`;
          })
          .join("");
      }

      function openFormPanelById(id) {
        const bm = bookmarks.find((b) => bmId(b) === id);
        if (bm) openFormPanel(bm);
      }

      // ── Escape helpers ───────────────────────────────────────────────────────
      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function escAttr(s) {
        return String(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }

      // ── Init ─────────────────────────────────────────────────────────────────
      document
        .getElementById("form-submit-btn")
        .addEventListener("click", submitForm);
      ["bm-name", "bm-url", "bm-note"].forEach((id) => {
        document.getElementById(id).addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitForm();
          if (e.key === "Escape") closeFormPanel();
        });
      });

      (async function init() {
        if (isManage) {
          document.getElementById("toggle-form-btn").style.display =
            "inline-block";
        }
        try {
          bookmarks = await apiGetBookmarks();
        } catch (e) {
          console.error("無法載入常用連結：", e.message);
          bookmarks = [];
        }
        renderBookmarks();
      })();
    </script>
  </body>
</html>
