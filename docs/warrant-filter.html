<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warrant Filter | 權證篩選器</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <style>
      @media (max-width: 480px) {
        h1 span.title-text {
          display: none;
        }
      }

      .filter-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        margin-bottom: 1.5rem;
      }

      @media (min-width: 640px) {
        .filter-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1200px) {
        .filter-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 0; /* Prevent grid blowout */
      }

      .filter-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--hud-text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .filter-range {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filter-input {
        flex: 1;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--hud-border-2);
        border-radius: 2px;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.2s;
        min-width: 0;
      }

      .filter-input:focus {
        border-color: var(--hud-text-1);
      }

      th:hover {
        background-color: var(--hud-card-bg);
      }

      .btn-primary {
        background: transparent;
        border: 1px solid var(--hud-border-1);
        color: var(--hud-text-1);
      }

      .btn-primary:hover {
        background: var(--hud-hover-bg);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          id="header-logo"
          src="assets/logo.png"
          alt="Logo"
          style="height: 40px; width: auto"
          onerror="
            this.style.display = 'none';
            document.getElementById('header-emoji').style.display = 'inline';
          "
        />
        <span id="header-emoji" style="display: none; font-size: 1.5rem"
          >🔍</span
        >
        <h1><span class="title-text">Warrant Filter</span></h1>
        <nav class="nav-bar">
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">市場</button>
            <div class="nav-dropdown-menu">
              <a href="twse.html" class="nav-dropdown-item">上市</a>
              <a href="tpex.html" class="nav-dropdown-item">上櫃</a>
              <a href="index.html" class="nav-dropdown-item">全部</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">策略</button>
            <div class="nav-dropdown-menu">
              <a href="gap.html" class="nav-dropdown-item">跳空漲跌</a>
              <a href="punish.html" class="nav-dropdown-item">處置股票</a>
              <a href="wantgoo.html" class="nav-dropdown-item">基本面</a>
              <a href="volatility.html" class="nav-dropdown-item">區間波動率</a>
              <a href="vcp.html" class="nav-dropdown-item">VCP選股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn active">權證</button>
            <div class="nav-dropdown-menu">
              <a href="premium-warrant.html" class="nav-dropdown-item"
                >精選權證</a
              >
              <a href="warrant-filter.html" class="nav-dropdown-item active"
                >權證篩選</a
              >
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">選股</button>
            <div class="nav-dropdown-menu">
              <a href="screener.html" class="nav-dropdown-item">股票篩選器</a>
              <a href="watchlist.html" class="nav-dropdown-item">精選類股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">個人</button>
            <div class="nav-dropdown-menu">
              <a href="bookmark.html" class="nav-dropdown-item">常用連結</a>
              <a href="portfolio.html" class="nav-dropdown-item">持股試算</a>
            </div>
          </div>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="切換深色模式">
          🌙
        </button>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <div class="card-title">篩選條件</div>
        <div class="filter-grid">
          <div class="filter-group">
            <label class="filter-label">標的代號 (多個請用逗號隔開)</label>
            <input
              type="text"
              id="stock_codes"
              class="filter-input"
              placeholder="例如: 2330, 2317"
            />
          </div>
          <div class="filter-group">
            <label class="filter-label">權證類型</label>
            <select id="type" class="filter-input">
              <option value="0">全部</option>
              <option value="1" selected>認購</option>
              <option value="2">認售</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">剩餘天數</label>
            <div class="filter-range">
              <input
                type="text"
                id="period_left"
                class="filter-input"
                value="90"
              />
              <span>~</span>
              <input
                type="text"
                id="period_right"
                class="filter-input"
                placeholder="最大"
              />
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">成交量 (張)</label>
            <div class="filter-range">
              <input
                type="text"
                id="volume_left"
                class="filter-input"
                placeholder="最小"
                value="500"
              />
              <span>~</span>
              <input
                type="text"
                id="volume_right"
                class="filter-input"
                placeholder="最大"
              />
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">實質槓桿</label>
            <div class="filter-range">
              <input
                type="text"
                id="leverage_left"
                class="filter-input"
                placeholder="最小"
                value="3"
              />
              <span>~</span>
              <input
                type="text"
                id="leverage_right"
                class="filter-input"
                placeholder="最大"
              />
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">價內外程度 (%)</label>
            <div class="filter-range">
              <input
                type="text"
                id="in_out_left"
                class="filter-input"
                value="-20"
              />
              <span>~</span>
              <input
                type="text"
                id="in_out_right"
                class="filter-input"
                value="20"
              />
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">流通在外比例 (%)</label>
            <div class="filter-range">
              <input
                type="text"
                id="out_vol_rate_left"
                class="filter-input"
                placeholder="最小"
                value="30"
              />
              <span>~</span>
              <input
                type="text"
                id="out_vol_rate_right"
                class="filter-input"
                placeholder="最大"
                value="70"
              />
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">買賣價差比 (%)</label>
            <div class="filter-range">
              <input
                type="text"
                id="buy_sell_rate_left"
                class="filter-input"
                placeholder="最小"
                value="0"
              />
              <span>~</span>
              <input
                type="text"
                id="buy_sell_rate_right"
                class="filter-input"
                placeholder="最大"
                value="1.5"
              />
            </div>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end">
          <button id="search-btn" class="btn btn-primary">執行篩選</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span
            >篩選結果
            <span id="warrant-count" class="badge badge-primary">0</span></span
          >
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th onclick="setSort('權證代碼')">
                  權證代碼 <span id="sort-權證代碼"></span>
                </th>
                <th onclick="setSort('權證名稱')">
                  權證名稱 <span id="sort-權證名稱"></span>
                </th>
                <th onclick="setSort('標的名稱')">
                  標的 <span id="sort-標的名稱"></span>
                </th>
                <th onclick="setSort('認購/認售')">
                  認購/認售 <span id="sort-認購/認售"></span>
                </th>
                <th onclick="setSort('權證成交價')">
                  成交價 <span id="sort-權證成交價"></span>
                </th>
                <th onclick="setSort('權證成交量')">
                  成交量 <span id="sort-權證成交量"></span>
                </th>
                <th onclick="setSort('流通在外比例')">
                  流通在外% <span id="sort-流通在外比例"></span>
                </th>
                <th onclick="setSort('買賣價差比率')">
                  價差比% <span id="sort-買賣價差比率"></span>
                </th>
                <th onclick="setSort('最新履約價')">
                  履約價 <span id="sort-最新履約價"></span>
                </th>
                <th onclick="setSort('剩餘天數')">
                  剩餘天數 <span id="sort-剩餘天數"></span>
                </th>
                <th onclick="setSort('價內外程度')">
                  價內外 <span id="sort-價內外程度"></span>
                </th>
                <th onclick="setSort('實質槓桿')">
                  實質槓桿 <span id="sort-實質槓桿"></span>
                </th>
              </tr>
            </thead>
            <tbody id="warrant-list"></tbody>
          </table>
        </div>
        <div id="loader" class="loader">正在分析市場數據...</div>
      </div>
    </div>

    <script src="assets/nerd-grid.js"></script>
    <script>
      let currentData = [];
      let sortColumn = "權證成交量";
      let sortDirection = "desc";

      async function fetchFilteredWarrants() {
        const loader = document.getElementById("loader");
        const list = document.getElementById("warrant-list");
        const countLabel = document.getElementById("warrant-count");

        loader.style.display = "flex";
        list.innerHTML = "";
        countLabel.textContent = "0";

        const stockCodesInput = document.getElementById("stock_codes").value;
        const typeSelect = document.getElementById("type");
        const selectedType = typeSelect.value;

        const payload = {
          stock_codes: stockCodesInput
            ? stockCodesInput.split(",").map((s) => s.trim())
            : [],
          type: selectedType === "0" ? ["1", "2"] : [selectedType],
          in_out: {
            left: document.getElementById("in_out_left").value || "",
            right: document.getElementById("in_out_right").value || "",
          },
          leverage: {
            left: document.getElementById("leverage_left").value || "",
            right: document.getElementById("leverage_right").value || "",
          },
          volume: {
            left: document.getElementById("volume_left").value || "",
            right: document.getElementById("volume_right").value || "",
          },
          period: {
            left: document.getElementById("period_left").value || "",
            right: document.getElementById("period_right").value || "",
          },
          out_vol_rate: {
            left: document.getElementById("out_vol_rate_left").value || "",
            right: document.getElementById("out_vol_rate_right").value || "",
          },
          buy_sell_rate: {
            left: document.getElementById("buy_sell_rate_left").value || "",
            right: document.getElementById("buy_sell_rate_right").value || "",
          },
        };

        try {
          const response = await fetch(
            "https://market.smallplum.xyz/api/mktobs/warrant/filter",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          if (!response.ok) throw new Error("API request failed");

          currentData = await response.json();
          renderTable();
        } catch (error) {
          console.error("Error:", error);
          list.innerHTML = `<tr><td colspan="12" style="text-align: center; color: var(--hud-up);">載入失敗，請稍後再試</td></tr>`;
        } finally {
          loader.style.display = "none";
        }
      }

      function setSort(col) {
        if (sortColumn === col) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = col;
          sortDirection = "desc";
        }
        renderTable();
      }

      function renderTable() {
        const list = document.getElementById("warrant-list");
        const countLabel = document.getElementById("warrant-count");
        list.innerHTML = "";
        countLabel.textContent = currentData.length;

        const sortedData = [...currentData].sort((a, b) => {
          let vA = a[sortColumn];
          let vB = b[sortColumn];

          if (
            [
              "權證成交價",
              "權證成交量",
              "流通在外比例",
              "買賣價差比率",
              "最新履約價",
              "剩餘天數",
              "實質槓桿",
            ].includes(sortColumn)
          ) {
            vA = parseFloat(vA) || 0;
            vB = parseFloat(vB) || 0;
          }

          if (vA < vB) return sortDirection === "asc" ? -1 : 1;
          if (vA > vB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });

        document
          .querySelectorAll("th span")
          .forEach((s) => (s.textContent = ""));
        const indicator = document.getElementById("sort-" + sortColumn);
        if (indicator)
          indicator.textContent = sortDirection === "asc" ? " ↑" : " ↓";

        sortedData.forEach((w) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="font-weight: 500;">
                <a href="https://www.warrantwin.com.tw/eyuanta/warrant/Info.aspx?WID=${w["權證代碼"]}" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px dashed var(--hud-text-3);">${w["權證代碼"]}</a>
            </td>
            <td style="font-weight: 600;">${w["權證名稱"]}</td>
            <td>
                <div style="font-weight: 600;">${w["標的名稱"]}</div>
                <div style="font-size: 0.75rem; color: var(--hud-text-3);">${w["標的代碼"]}</div>
            </td>
            <td>${w["認購/認售"]}</td>
            <td style="font-weight: 700; color: var(--hud-text-1);">${w["權證成交價"]}</td>
            <td>${parseInt(w["權證成交量"] || 0).toLocaleString()}</td>
            <td>${w["流通在外比例"]}%</td>
            <td style="color: ${parseFloat(w["買賣價差比率"]) > 1 ? "var(--hud-up)" : "inherit"}">${w["買賣價差比率"]}%</td>
            <td>${w["最新履約價"]}</td>
            <td>${w["剩餘天數"]}</td>
            <td>${w["價內外程度"]}</td>
            <td style="font-weight: 700;">${w["實質槓桿"]}</td>
          `;
          list.appendChild(tr);
        });

        if (currentData.length === 0) {
          list.innerHTML = `<tr><td colspan="12" style="text-align: center; color: var(--hud-text-3);">無符合條件的權證</td></tr>`;
        }
      }

      document.getElementById("search-btn").onclick = fetchFilteredWarrants;

      // Enter key triggers search
      document.querySelectorAll(".filter-input").forEach((el) => {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") fetchFilteredWarrants();
        });
      });
      NerdGrid.initThemeToggle();
      NerdGrid.initNavDropdowns();

      // Save/restore filter values in localStorage
      const filterIds = [
        "stock_codes",
        "type",
        "period_left",
        "period_right",
        "volume_left",
        "volume_right",
        "leverage_left",
        "leverage_right",
        "in_out_left",
        "in_out_right",
        "out_vol_rate_left",
        "out_vol_rate_right",
        "buy_sell_rate_left",
        "buy_sell_rate_right",
      ];
      filterIds.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const saved = localStorage.getItem("wf_" + id);
        if (saved !== null) el.value = saved;
        el.addEventListener("change", () =>
          localStorage.setItem("wf_" + id, el.value),
        );
      });

      // Initial fetch
      fetchFilteredWarrants();
    </script>
  </body>
</html>
