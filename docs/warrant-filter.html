<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warrant Filter | 權證篩選器</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <style>
      .filter-pill input,
      .filter-pill select {
        flex: 1;
        min-width: 0;
        width: 72px;
      }

      .filter-pill label,
      .filter-pill > span:first-child {
        white-space: nowrap;
      }

      .filter-pill.grow {
        flex: 1 1 280px;
        min-width: 0;
      }

      .filter-pill.grow input {
        width: 100%;
      }

      .table-container th[onclick] {
        cursor: pointer;
      }

      .table-container th[onclick]:hover {
        background: var(--hover);
      }

      .actions-row {
        display: flex;
        gap: var(--s2);
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <header id="site-header"></header>

    <div class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">權證篩選</h1>
          <p class="page-subtitle">依條件篩選權證</p>
        </div>
      </div>
      <div class="card">
        <div class="card-title">篩選條件</div>
        <div class="toolbar">
          <div class="filter-pill grow">
            <label for="stock_codes">標的代號</label>
            <input type="text" id="stock_codes" class="filter-input" placeholder="多個請用逗號隔開，例如: 2330, 2317" />
          </div>
          <div class="filter-pill">
            <label for="type">權證類型</label>
            <select id="type" class="filter-input">
              <option value="0">全部</option>
              <option value="1" selected>認購</option>
              <option value="2">認售</option>
            </select>
          </div>
          <div class="filter-pill">
            <span>剩餘天數</span>
            <input type="text" id="period_left" class="filter-input" value="90" aria-label="剩餘天數 最小" />
            <span>~</span>
            <input type="text" id="period_right" class="filter-input" placeholder="最大" aria-label="剩餘天數 最大" />
          </div>
          <div class="filter-pill">
            <span>成交量 (張)</span>
            <input type="text" id="volume_left" class="filter-input" placeholder="最小" value="500" aria-label="成交量 (張) 最小" />
            <span>~</span>
            <input type="text" id="volume_right" class="filter-input" placeholder="最大" aria-label="成交量 (張) 最大" />
          </div>
          <div class="filter-pill">
            <span>實質槓桿</span>
            <input type="text" id="leverage_left" class="filter-input" placeholder="最小" value="3" aria-label="實質槓桿 最小" />
            <span>~</span>
            <input type="text" id="leverage_right" class="filter-input" placeholder="最大" aria-label="實質槓桿 最大" />
          </div>
          <div class="filter-pill">
            <span>價內外程度 (%)</span>
            <input type="text" id="in_out_left" class="filter-input" value="-20" aria-label="價內外程度 (%) 最小" />
            <span>~</span>
            <input type="text" id="in_out_right" class="filter-input" placeholder="最大" value="20" aria-label="價內外程度 (%) 最大" />
          </div>
          <div class="filter-pill">
            <span>流通在外比例 (%)</span>
            <input type="text" id="out_vol_rate_left" class="filter-input" placeholder="最小" value="30" aria-label="流通在外比例 (%) 最小" />
            <span>~</span>
            <input type="text" id="out_vol_rate_right" class="filter-input" placeholder="最大" value="70" aria-label="流通在外比例 (%) 最大" />
          </div>
          <div class="filter-pill">
            <span>買賣價差比 (%)</span>
            <input type="text" id="buy_sell_rate_left" class="filter-input" placeholder="最小" value="0" aria-label="買賣價差比 (%) 最小" />
            <span>~</span>
            <input type="text" id="buy_sell_rate_right" class="filter-input" placeholder="最大" value="1.5" aria-label="買賣價差比 (%) 最大" />
          </div>
        </div>
        <div class="actions-row">
          <button id="search-btn" class="btn btn-primary">執行篩選</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span
            >篩選結果
            <span id="warrant-count" class="badge badge-primary">0</span></span
          >
        </div>
        <div class="table-container sticky">
          <table>
            <thead>
              <tr>
                <th onclick="setSort('權證代碼')">
                  權證代碼 <span id="sort-權證代碼"></span>
                </th>
                <th onclick="setSort('權證名稱')">
                  權證名稱 <span id="sort-權證名稱"></span>
                </th>
                <th onclick="setSort('標的名稱')">
                  標的 <span id="sort-標的名稱"></span>
                </th>
                <th onclick="setSort('認購/認售')">
                  認購/認售 <span id="sort-認購/認售"></span>
                </th>
                <th onclick="setSort('權證成交價')">
                  成交價 <span id="sort-權證成交價"></span>
                </th>
                <th onclick="setSort('權證成交量')">
                  成交量 <span id="sort-權證成交量"></span>
                </th>
                <th onclick="setSort('流通在外比例')">
                  流通在外% <span id="sort-流通在外比例"></span>
                </th>
                <th onclick="setSort('買賣價差比率')">
                  價差比% <span id="sort-買賣價差比率"></span>
                </th>
                <th onclick="setSort('最新履約價')">
                  履約價 <span id="sort-最新履約價"></span>
                </th>
                <th onclick="setSort('剩餘天數')">
                  剩餘天數 <span id="sort-剩餘天數"></span>
                </th>
                <th onclick="setSort('價內外程度')">
                  價內外 <span id="sort-價內外程度"></span>
                </th>
                <th onclick="setSort('實質槓桿')">
                  實質槓桿 <span id="sort-實質槓桿"></span>
                </th>
              </tr>
            </thead>
            <tbody id="warrant-list"></tbody>
          </table>
        </div>
        <div id="result-state"></div>
        <div id="loader" class="loader">正在分析市場數據...</div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/shell.js"></script>
    <script>
      let currentData = [];
      let sortColumn = "權證成交量";
      let sortDirection = "desc";
      let loadFailed = false;

      async function fetchFilteredWarrants() {
        const loader = document.getElementById("loader");
        const list = document.getElementById("warrant-list");
        const countLabel = document.getElementById("warrant-count");

        loadFailed = false;
        document.getElementById("result-state").innerHTML = "";

        loader.style.display = "flex";
        list.innerHTML = "";
        countLabel.textContent = "0";

        const stockCodesInput = document.getElementById("stock_codes").value;
        const typeSelect = document.getElementById("type");
        const selectedType = typeSelect.value;

        const payload = {
          stock_codes: stockCodesInput
            ? stockCodesInput.split(",").map((s) => s.trim())
            : [],
          type: selectedType === "0" ? ["1", "2"] : [selectedType],
          in_out: {
            left: document.getElementById("in_out_left").value || "",
            right: document.getElementById("in_out_right").value || "",
          },
          leverage: {
            left: document.getElementById("leverage_left").value || "",
            right: document.getElementById("leverage_right").value || "",
          },
          volume: {
            left: document.getElementById("volume_left").value || "",
            right: document.getElementById("volume_right").value || "",
          },
          period: {
            left: document.getElementById("period_left").value || "",
            right: document.getElementById("period_right").value || "",
          },
          out_vol_rate: {
            left: document.getElementById("out_vol_rate_left").value || "",
            right: document.getElementById("out_vol_rate_right").value || "",
          },
          buy_sell_rate: {
            left: document.getElementById("buy_sell_rate_left").value || "",
            right: document.getElementById("buy_sell_rate_right").value || "",
          },
        };

        try {
          const response = await fetch(
            "https://market.smallplum.xyz/api/mktobs/warrant/filter",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            },
          );

          if (!response.ok) throw new Error("API request failed");

          currentData = await response.json();
          renderTable();
        } catch (error) {
          console.error("Error:", error);
          loadFailed = true;
          currentData = [];
          UIData.renderState(document.getElementById("result-state"), "error", {
            message: "資料載入失敗",
            onRetry: fetchFilteredWarrants,
          });
        } finally {
          loader.style.display = "none";
        }
      }

      function setSort(col) {
        if (sortColumn === col) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = col;
          sortDirection = "desc";
        }
        renderTable();
      }

      function renderTable() {
        const list = document.getElementById("warrant-list");
        const countLabel = document.getElementById("warrant-count");
        list.innerHTML = "";
        countLabel.textContent = currentData.length;

        const sortedData = [...currentData].sort((a, b) => {
          let vA = a[sortColumn];
          let vB = b[sortColumn];

          if (
            [
              "權證成交價",
              "權證成交量",
              "流通在外比例",
              "買賣價差比率",
              "最新履約價",
              "剩餘天數",
              "實質槓桿",
            ].includes(sortColumn)
          ) {
            vA = parseFloat(vA) || 0;
            vB = parseFloat(vB) || 0;
          }

          if (vA < vB) return sortDirection === "asc" ? -1 : 1;
          if (vA > vB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });

        document
          .querySelectorAll("th span")
          .forEach((s) => (s.textContent = ""));
        const indicator = document.getElementById("sort-" + sortColumn);
        if (indicator)
          indicator.textContent = sortDirection === "asc" ? " ↑" : " ↓";

        sortedData.forEach((w) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="font-weight: 500;">
                <a href="https://www.warrantwin.com.tw/eyuanta/warrant/Info.aspx?WID=${w["權證代碼"]}" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px dashed var(--text-muted);">${w["權證代碼"]}</a>
            </td>
            <td style="font-weight: 600;">${w["權證名稱"]}</td>
            <td>
                <div style="font-weight: 600;">${w["標的名稱"]}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${w["標的代碼"]}</div>
            </td>
            <td>${w["認購/認售"]}</td>
            <td style="font-weight: 700; color: var(--text);">${w["權證成交價"]}</td>
            <td>${parseInt(w["權證成交量"] || 0).toLocaleString()}</td>
            <td>${w["流通在外比例"]}%</td>
            <td style="color: ${parseFloat(w["買賣價差比率"]) > 1 ? "var(--up)" : "inherit"}">${w["買賣價差比率"]}%</td>
            <td>${w["最新履約價"]}</td>
            <td>${w["剩餘天數"]}</td>
            <td>${w["價內外程度"]}</td>
            <td style="font-weight: 700;">${w["實質槓桿"]}</td>
          `;
          list.appendChild(tr);
        });

        if (currentData.length === 0 && !loadFailed) {
          UIData.renderState(document.getElementById("result-state"), "empty", {
            title: "沒有符合的資料",
            hint: "請調整日期或篩選條件",
          });
        }
      }

      document.getElementById("search-btn").onclick = fetchFilteredWarrants;

      // Enter key triggers search
      document.querySelectorAll(".filter-input").forEach((el) => {
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter") fetchFilteredWarrants();
        });
      });

      // Save/restore filter values in localStorage
      const filterIds = [
        "stock_codes",
        "type",
        "period_left",
        "period_right",
        "volume_left",
        "volume_right",
        "leverage_left",
        "leverage_right",
        "in_out_left",
        "in_out_right",
        "out_vol_rate_left",
        "out_vol_rate_right",
        "buy_sell_rate_left",
        "buy_sell_rate_right",
      ];
      filterIds.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const saved = localStorage.getItem("wf_" + id);
        if (saved !== null) el.value = saved;
        el.addEventListener("change", () =>
          localStorage.setItem("wf_" + id, el.value),
        );
      });

      // Initial fetch
      fetchFilteredWarrants();
    </script>
  </body>
</html>
