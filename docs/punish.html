<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punishment Observer | 處置股票觀測站</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/nerd-grid.css" />
    <style>
      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        align-items: center;
        background: var(--hud-bg);
        padding: 1rem;
        border-radius: 2px;
        border: 1px solid var(--hud-border-2);
      }

      .control-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .control-label {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--hud-text-3);
      }

      .select-input,
      .date-input {
        padding: 0.5rem 0.75rem;
        border-radius: 2px;
        border: 1px solid var(--hud-border-2);
        background: var(--hud-card-bg);
        color: var(--hud-text-1);
        font-size: 0.875rem;
        outline: none;
        color-scheme: dark;
      }

      [data-theme="light"] .date-input {
        color-scheme: light;
      }

      .select-input:focus,
      .date-input:focus {
        border-color: var(--hud-text-1);
      }

      th:hover {
        background-color: var(--hud-card-bg);
      }

      [v-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          id="header-logo"
          src="assets/logo.png"
          alt="Logo"
          style="height: 40px; width: auto"
          onerror="
            this.style.display = 'none';
            document.getElementById('header-emoji').style.display = 'inline';
          "
        />
        <span id="header-emoji" style="display: none; font-size: 1.5rem"
          >⚖️</span
        >
        <h1><span class="title-text">Market Observer</span></h1>
        <nav class="nav-bar">
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">市場</button>
            <div class="nav-dropdown-menu">
              <a href="twse.html" class="nav-dropdown-item">上市</a>
              <a href="tpex.html" class="nav-dropdown-item">上櫃</a>
              <a href="index.html" class="nav-dropdown-item">全部</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn active">策略</button>
            <div class="nav-dropdown-menu">
              <a href="gap.html" class="nav-dropdown-item">跳空漲跌</a>
              <a href="punish.html" class="nav-dropdown-item active"
                >處置股票</a
              >
              <a href="wantgoo.html" class="nav-dropdown-item">基本面</a>
              <a href="volatility.html" class="nav-dropdown-item">區間波動率</a>
              <a href="vcp.html" class="nav-dropdown-item">VCP選股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">權證</button>
            <div class="nav-dropdown-menu">
              <a href="premium-warrant.html" class="nav-dropdown-item"
                >精選權證</a
              >
              <a href="warrant-filter.html" class="nav-dropdown-item"
                >權證篩選</a
              >
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">選股</button>
            <div class="nav-dropdown-menu">
              <a href="screener.html" class="nav-dropdown-item">股票篩選器</a>
              <a href="watchlist.html" class="nav-dropdown-item">精選類股</a>
            </div>
          </div>
          <div class="nav-dropdown">
            <button class="nav-link nav-dropdown-btn">個人</button>
            <div class="nav-dropdown-menu">
              <a href="bookmark.html" class="nav-dropdown-item">常用連結</a>
              <a href="portfolio.html" class="nav-dropdown-item">持股試算</a>
            </div>
          </div>
        </nav>
        <button class="theme-toggle" id="theme-toggle" title="切換深色模式">
          🌙
        </button>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <div class="card-title">
          <span>處置股票紀錄</span>
        </div>

        <div class="controls">
          <div class="control-item">
            <span class="control-label">市場:</span>
            <select id="market-select" class="select-input">
              <option value="twse">上市 (TWSE)</option>
              <option value="tpex">上櫃 (TPEX)</option>
            </select>
          </div>
          <div class="control-item">
            <span class="control-label">起始日期:</span>
            <input type="date" id="start-date" class="date-input" />
          </div>
          <div class="control-item">
            <span class="control-label">結束日期:</span>
            <input type="date" id="end-date" class="date-input" />
          </div>
          <button id="fetch-btn" class="btn">查詢</button>
        </div>

        <div class="table-container">
          <table id="punish-table">
            <thead>
              <tr>
                <th onclick="setSort('publish_date')">
                  發布日期 <span id="sort-publish_date"></span>
                </th>
                <th onclick="setSort('id')">代號 <span id="sort-id"></span></th>
                <th onclick="setSort('name')">
                  名稱 <span id="sort-name"></span>
                </th>
                <th onclick="setSort('measure')">
                  處置措施 <span id="sort-measure"></span>
                </th>
                <th onclick="setSort('accumulated')">
                  次數 <span id="sort-accumulated"></span>
                </th>
                <th onclick="setSort('from')">
                  起始日 <span id="sort-from"></span>
                </th>
                <th onclick="setSort('to')">
                  結束日 <span id="sort-to"></span>
                </th>
                <th onclick="setSort('condition')">
                  處置條件 <span id="sort-condition"></span>
                </th>
              </tr>
            </thead>
            <tbody id="punish-list">
              <!-- Data will be loaded here -->
            </tbody>
          </table>
        </div>
        <div id="loader" class="loader" style="display: none">載入中...</div>
      </div>
    </div>

    <script src="assets/nerd-grid.js"></script>
    <script>
      let punishData = [];
      let sortColumn = "publish_date";
      let sortDirection = "desc";

      async function init() {
        try {
          const today = new Date();
          const thirtyDaysAgo = new Date();
          thirtyDaysAgo.setDate(today.getDate() - 30);

          const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
          };

          document.getElementById("start-date").value = formatDate(today);
          document.getElementById("end-date").value = formatDate(today);

          document
            .getElementById("fetch-btn")
            .addEventListener("click", fetchData);

          // Enter key triggers fetch
          document
            .querySelectorAll(".date-input, .select-input")
            .forEach((el) => {
              el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") fetchData();
              });
            });
          NerdGrid.initThemeToggle();
          NerdGrid.initNavDropdowns();

          // Initial fetch
          fetchData();
        } catch (error) {
          console.error("Initialization error:", error);
        }
      }

      async function fetchData() {
        const market = document.getElementById("market-select").value;
        const start = document.getElementById("start-date").value;
        const end = document.getElementById("end-date").value;

        const loader = document.getElementById("loader");
        const tbody = document.getElementById("punish-list");

        loader.style.display = "flex";
        tbody.innerHTML = "";
        punishData = [];

        try {
          const url = `https://market.smallplum.xyz/api/mktobs/${market}/daily/punishment?start_date=${start}&end_date=${end}`;
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("API request failed");
          punishData = await resp.json();
        } catch (e) {
          console.error(`Error fetching punishment data:`, e);
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--hud-up);">載入失敗: ${e.message}</td></tr>`;
        } finally {
          loader.style.display = "none";
          renderTable();
        }
      }

      function setSort(col) {
        if (sortColumn === col) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = col;
          sortDirection = "desc";
        }
        renderTable();
      }

      function renderTable() {
        const tbody = document.getElementById("punish-list");
        tbody.innerHTML = "";

        punishData.sort((a, b) => {
          let valA = a[sortColumn];
          let valB = b[sortColumn];

          if (sortColumn === "accumulated") {
            valA = parseInt(valA) || 0;
            valB = parseInt(valB) || 0;
          }

          if (valA < valB) return sortDirection === "asc" ? -1 : 1;
          if (valA > valB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });

        // Update sort indicators
        document
          .querySelectorAll("th span")
          .forEach((s) => (s.textContent = ""));
        const indicator = document.getElementById("sort-" + sortColumn);
        if (indicator)
          indicator.textContent = sortDirection === "asc" ? " ↑" : " ↓";

        punishData.forEach((item) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
                <td>${item.publish_date}</td>
                <td style="font-weight: 500;">${item.id}</td>
                <td style="font-weight: 600;">${item.name}</td>
                <td><span class="badge badge-danger">${item.measure}</span></td>
                <td>${item.accumulated}</td>
                <td>${item.from}</td>
                <td>${item.to}</td>
                <td style="font-size: 0.8rem; color: var(--hud-text-3);">${item.condition}</td>
            `;
          tbody.appendChild(tr);
        });

        if (punishData.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--hud-text-3); font-style: italic;">無處置紀錄</td></tr>';
        }
      }

      init();
    </script>
  </body>
</html>
