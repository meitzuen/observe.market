<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punishment Observer | 處置股票觀測站</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/ui.css" />
    <style>
      .filter-pill select,
      .filter-pill input[type="date"] {
        width: auto;
      }
    </style>
  </head>
  <body>
    <header id="site-header"></header>

    <div class="container" id="main">
      <div class="page-header">
        <div>
          <h1 class="page-title">處置股票</h1>
          <p class="page-subtitle">最新處置股票名單</p>
        </div>
      </div>
      <div class="card">
        <div class="card-title">
          <span>處置股票紀錄</span>
        </div>

        <div class="toolbar">
          <label class="filter-pill">
            <span>市場:</span>
            <select id="market-select" class="select-input">
              <option value="twse">上市 (TWSE)</option>
              <option value="tpex">上櫃 (TPEX)</option>
            </select>
          </label>
          <label class="filter-pill">
            <span>起始日期:</span>
            <input type="date" id="start-date" class="date-input" />
          </label>
          <label class="filter-pill">
            <span>結束日期:</span>
            <input type="date" id="end-date" class="date-input" />
          </label>
          <button id="fetch-btn" class="btn btn-primary">查詢</button>
        </div>

        <div class="table-container">
          <table id="punish-table">
            <thead>
              <tr>
                <th onclick="setSort('publish_date')">
                  發布日期 <span id="sort-publish_date"></span>
                </th>
                <th onclick="setSort('id')">代號 <span id="sort-id"></span></th>
                <th onclick="setSort('name')">
                  名稱 <span id="sort-name"></span>
                </th>
                <th onclick="setSort('measure')">
                  處置措施 <span id="sort-measure"></span>
                </th>
                <th onclick="setSort('accumulated')">
                  次數 <span id="sort-accumulated"></span>
                </th>
                <th onclick="setSort('from')">
                  起始日 <span id="sort-from"></span>
                </th>
                <th onclick="setSort('to')">
                  結束日 <span id="sort-to"></span>
                </th>
                <th onclick="setSort('condition')">
                  處置條件 <span id="sort-condition"></span>
                </th>
              </tr>
            </thead>
            <tbody id="punish-list">
              <!-- Data will be loaded here -->
            </tbody>
          </table>
        </div>
        <div id="punish-state"></div>
        <div id="loader" class="loader" style="display: none">載入中...</div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/shell.js"></script>
    <script>
      let punishData = [];
      let sortColumn = "publish_date";
      let sortDirection = "desc";
      let fetchFailed = false;

      async function init() {
        try {
          const today = new Date();
          const thirtyDaysAgo = new Date();
          thirtyDaysAgo.setDate(today.getDate() - 30);

          const formatDate = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, "0");
            const d = String(date.getDate()).padStart(2, "0");
            return `${y}-${m}-${d}`;
          };

          document.getElementById("start-date").value = formatDate(today);
          document.getElementById("end-date").value = formatDate(today);

          document
            .getElementById("fetch-btn")
            .addEventListener("click", fetchData);

          // Enter key triggers fetch
          document
            .querySelectorAll(".date-input, .select-input")
            .forEach((el) => {
              el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") fetchData();
              });
            });

          // Initial fetch
          fetchData();
        } catch (error) {
          console.error("Initialization error:", error);
        }
      }

      async function fetchData() {
        const market = document.getElementById("market-select").value;
        const start = document.getElementById("start-date").value;
        const end = document.getElementById("end-date").value;

        const loader = document.getElementById("loader");
        const tbody = document.getElementById("punish-list");
        const stateEl = document.getElementById("punish-state");

        loader.style.display = "flex";
        tbody.innerHTML = "";
        stateEl.innerHTML = "";
        fetchFailed = false;
        punishData = [];

        try {
          const url = `https://market.smallplum.xyz/api/mktobs/${market}/daily/punishment?start_date=${start}&end_date=${end}`;
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("API request failed");
          punishData = await resp.json();
        } catch (e) {
          console.error(`Error fetching punishment data:`, e);
          fetchFailed = true;
          UIData.renderState(stateEl, "error", {
            message: "資料載入失敗",
            onRetry: fetchData,
          });
        } finally {
          loader.style.display = "none";
          renderTable();
        }
      }

      function setSort(col) {
        if (sortColumn === col) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortColumn = col;
          sortDirection = "desc";
        }
        renderTable();
      }

      function renderTable() {
        const tbody = document.getElementById("punish-list");
        tbody.innerHTML = "";

        punishData.sort((a, b) => {
          let valA = a[sortColumn];
          let valB = b[sortColumn];

          if (sortColumn === "accumulated") {
            valA = parseInt(valA) || 0;
            valB = parseInt(valB) || 0;
          }

          if (valA < valB) return sortDirection === "asc" ? -1 : 1;
          if (valA > valB) return sortDirection === "asc" ? 1 : -1;
          return 0;
        });

        // Update sort indicators
        document
          .querySelectorAll("th span")
          .forEach((s) => (s.textContent = ""));
        const indicator = document.getElementById("sort-" + sortColumn);
        if (indicator)
          indicator.textContent = sortDirection === "asc" ? " ↑" : " ↓";

        punishData.forEach((item) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
                <td>${item.publish_date}</td>
                <td style="font-weight: 500;">${item.id}</td>
                <td style="font-weight: 600;">${item.name}</td>
                <td><span class="badge badge-danger">${item.measure}</span></td>
                <td>${item.accumulated}</td>
                <td>${item.from}</td>
                <td>${item.to}</td>
                <td class="wrap" style="font-size: 0.8rem; color: var(--text-muted);">${item.condition}</td>
            `;
          tbody.appendChild(tr);
        });

        if (!fetchFailed) {
          const stateEl = document.getElementById("punish-state");
          stateEl.innerHTML = "";
          if (punishData.length === 0) {
            UIData.renderState(stateEl, "empty", {
              title: "沒有符合的資料",
              hint: "請調整日期或篩選條件",
            });
          }
        }
      }

      init();
    </script>
  </body>
</html>
