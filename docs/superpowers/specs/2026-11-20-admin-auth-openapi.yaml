openapi: 3.1.0
info:
  title: mktobs admin auth contract
  version: 1.0.0
  description: |
    Contract for admin-only writes on the existing mktobs API, authenticated with a
    Google ID token. The browser signs in with Google Identity Services and sends
    `Authorization: Bearer <Google ID token>`; there are no cookies or server-side sessions.
    Only auth behaviour is specified; request/response bodies of the existing
    bookmark / watchlist / surge endpoints are unchanged (shown as free-form objects).

    ## Deployment notes (FastAPI on Cloud Run)
    Environment variables:
    - `GOOGLE_CLIENT_ID`: the OAuth web client ID; the token's `aud` must equal it.
    - `ADMIN_EMAILS`: comma-separated allowlist of Google emails (compare case-insensitively).
    - `FRONTEND_ORIGINS`: comma-separated allowed frontend origins, e.g. `https://observe.smallplum.xyz`.
      Used for CORS.

    Google Cloud Console (OAuth client): add the frontend origin (and `http://localhost:8000`
    for local preview) under "Authorized JavaScript origins". No redirect URI is needed.

    CORS: `allow_origins` = `FRONTEND_ORIGINS` (never `*`), allow_methods
    GET/POST/PUT/PATCH/DELETE/OPTIONS, allow_headers includes `Authorization` and `Content-Type`.
    Cookies are no longer used, so `allow_credentials` can be false.

    ## Token verification (`require_admin`)
    Run on every POST/PUT/PATCH/DELETE under /bookmark, /watchlist, /surge, and on GET /auth/me:
    1. `Authorization: Bearer <token>` present and a valid Google ID token (signature via Google certs,
       `iss` accounts.google.com, `aud` = GOOGLE_CLIENT_ID, not expired), else 401 `{"detail": "not_authenticated"}`;
    2. `email_verified` is true and `email` is in `ADMIN_EMAILS`, else 403 `{"detail": "forbidden"}`.
    GET endpoints other than /auth/me stay public. Scripts (e.g. `src/add_concepts_to_watchlist.py`)
    can call the same endpoints with their own Google ID token.
servers:
  - url: https://market.smallplum.xyz/api/mktobs

components:
  securitySchemes:
    googleIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Detail:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    Me:
      type: object
      required: [email, admin]
      properties:
        email: { type: string }
        admin: { type: boolean, const: true }
    FreeObject:
      type: object
      additionalProperties: true
  responses:
    Unauthorized:
      description: Missing, invalid or expired Google ID token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Detail" }
          example: { detail: not_authenticated }
    Forbidden:
      description: Valid token, but the email is not on the allowlist (or not verified).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Detail" }
          example: { detail: forbidden }
    AdminWrite:
      description: Unchanged success response of the existing endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FreeObject" }

paths:
  /auth/me:
    get:
      summary: Verify the Bearer token and report admin status
      security: [{ googleIdToken: [] }]
      responses:
        "200":
          description: Token accepted and email is on the allowlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
              example: { email: me@example.com, admin: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /bookmark:
    post:
      summary: Create bookmark (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: &write_responses
        "200": { $ref: "#/components/responses/AdminWrite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bookmark/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Update bookmark (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
    delete:
      summary: Delete bookmark (admin)
      security: [{ googleIdToken: [] }]
      responses: *write_responses

  /watchlist:
    post:
      summary: Create watchlist (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
  /watchlist/orders:
    patch:
      summary: Reorder watchlists (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
  /watchlist/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace a watchlist's items and order (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
    delete:
      summary: Delete a watchlist (admin)
      security: [{ googleIdToken: [] }]
      responses: *write_responses
  /watchlist/{name}/items:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    patch:
      summary: Add an item to a watchlist (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
  /watchlist/{name}/items/{stock_id}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: stock_id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove an item from a watchlist (admin)
      security: [{ googleIdToken: [] }]
      responses: *write_responses

  /surge:
    post:
      summary: Add a surge stock (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
  /surge/{symbol}:
    parameters:
      - { name: symbol, in: path, required: true, schema: { type: string } }
    put:
      summary: Update a surge stock's start date (admin)
      security: [{ googleIdToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FreeObject" }
      responses: *write_responses
    delete:
      summary: Delete a surge stock (admin)
      security: [{ googleIdToken: [] }]
      responses: *write_responses
