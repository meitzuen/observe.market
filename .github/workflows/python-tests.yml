name: Python tests
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/*.py"
      - "requirements.txt"
      - "pyproject.toml"
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = what update_data.yml runs; 3.14 = what local dev uses.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
