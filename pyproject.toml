[project]
name = "observe-market"
version = "0.1.0"
authors = [
  { name = "mzuen" },
]
description = "Market data observer for Taiwan stocks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/meitzuen/observe.market"

[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)"
]

[tool.poetry]
# Scripts only; this project is not an installable package.
package-mode = false
